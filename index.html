<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>İş Asistanım PRO</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --primary-color: #2563eb;
    }

    /* Gece Modu Stilleri */
    body.dark-mode {
      --bg-color: #1e1e2e;
      --card-bg: #2b2b3d;
      --text-color: #f1f1f1;
      --primary-color: #3b82f6;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: Arial, sans-serif;
      transition: background-color 0.3s, color 0.3s;
      margin: 0;
      padding: 20px;
    }

    /* 3. Yükleme Ekranı (Loading State) */
    #loading-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    body.dark-mode #loading-screen {
      background: rgba(30, 30, 46, 0.9);
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #ccc;
      border-top-color: var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Görev Kartı & Soft Renk Paleti */
    .task-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid rgba(0,0,0,0.05);
    }

    .color-picker {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .color-circle {
      width: 22px; height: 22px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .color-circle:hover { transform: scale(1.1); }
  </style>
</head>
<body>

  <!-- Yükleme Ekranı -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <p style="margin-top: 15px; font-weight: bold;">Verileriniz yükleniyor, lütfen bekleyin...</p>
  </div>

  <!-- Üst Bar ve Tema Değiştirici -->
  <header style="display: flex; justify-content: space-between; align-items: center;">
    <h2>İş Asistanım PRO</h2>
    <button onclick="toggleTheme()" style="padding: 8px 16px; cursor: pointer;">☀️ / 🌙 Tema Değiştir</button>
  </header>

  <hr style="opacity: 0.2; margin: 20px 0;">

  <!-- Görev Listesi Alanı -->
  <div id="task-list">
    <!-- Örnek Görev Kartı -->
    <div class="task-card" id="task-1" style="background-color: #FFE5EC;">
      <h3>Sesli Görev / Görsel</h3>
      
      <!-- 1. Düzeltilmiş Ses Oynatıcı -->
      <audio controls style="width: 100%; margin-top: 10px;">
        <source src="SES_DOSYASI_URL_VEYA_BLOB" type="audio/webm">
        <source src="SES_DOSYASI_URL_VEYA_BLOB" type="audio/mp3">
        Tarayıcınız ses öğesini desteklemiyor.
      </audio>

      <!-- 4. Soft Arka Plan Renk Paleti -->
      <p style="font-size: 12px; margin-top: 12px;">Kart Rengini Seçin:</p>
      <div class="color-picker">
        <div class="color-circle" style="background: #ffffff;" onclick="setTaskColor('task-1', '#ffffff')"></div>
        <div class="color-circle" style="background: #FFE5EC;" onclick="setTaskColor('task-1', '#FFE5EC')"></div> <!-- Soft Pembe -->
        <div class="color-circle" style="background: #E8F5E9;" onclick="setTaskColor('task-1', '#E8F5E9')"></div> <!-- Soft Yeşil -->
        <div class="color-circle" style="background: #E3F2FD;" onclick="setTaskColor('task-1', '#E3F2FD')"></div> <!-- Soft Mavi -->
        <div class="color-circle" style="background: #FFFDE7;" onclick="setTaskColor('task-1', '#FFFDE7')"></div> <!-- Soft Sarı -->
        <div class="color-circle" style="background: #F3E5F5;" onclick="setTaskColor('task-1', '#F3E5F5')"></div> <!-- Soft Mor -->
      </div>

      <!-- 5. Alarm Ekleme Formu -->
      <div style="margin-top: 15px; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 10px;">
        <label style="font-size: 13px;">⏰ ✏️ Alarm Kur:</label>
        <input type="datetime-local" id="alarm-time-1" style="padding: 5px; margin-left: 5px;">
        <button onclick="setAlarm('task-1', 'Sesli Görev / Görsel')" style="padding: 5px 10px; cursor: pointer;">Kaydet</button>
      </div>
    </div>
  </div>

  <script>
    // --- 2. Tema Kalıcılığı (Gece/Gündüz Hatası Çözümü) ---
    document.addEventListener("DOMContentLoaded", () => {
      const savedTheme = localStorage.getItem('appTheme') || 'light';
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
      }

      // 3. Yükleme ekranını veriler çekilince kapatma simülasyonu
      setTimeout(() => {
        document.getElementById('loading-screen').style.display = 'none';
      }, 1500);

      // Service Worker ve Bildirim İzni İstemi
      if ('Notification' in window) {
        Notification.requestPermission();
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    });

    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
      const currentTheme = document.body.classList.contains('dark-mode') ? 'dark' : 'light';
      localStorage.setItem('appTheme', currentTheme);
    }

    // --- 4. Kart Rengi Değiştirme ---
    function setTaskColor(taskId, color) {
      document.getElementById(taskId).style.backgroundColor = color;
      // İsteğe bağlı: Veritabanına veya localStorage'a kaydedebilirsiniz
    }

    // --- 5. Alarm Kurma Mantığı ---
    function setAlarm(taskId, taskTitle) {
      const timeInput = document.getElementById(`alarm-time-1`).value;
      if (!timeInput) {
        alert("Lütfen geçerli bir tarih ve saat seçin.");
        return;
      }

      const alarmTime = new Date(timeInput).getTime();
      const now = new Date().getTime();
      const timeToAlarm = alarmTime - now;

      if (timeToAlarm <= 0) {
        alert("Geçmiş bir zamana alarm kuramazsınız.");
        return;
      }

      alert(`Alarm ${timeInput} zamanına kuruldu!`);

      // Zamanı geldiğinde bildirimi tetikle
      setTimeout(() => {
        triggerNotification(taskTitle);
      }, timeToAlarm);
    }

    function triggerNotification(title) {
      if (Notification.permission === 'granted') {
        navigator.serviceWorker.ready.then(registration => {
          registration.showNotification('İş Asistanım PRO ⏰', {
            body: `Hatırlatma: ${title}`,
            icon: '/icon.png',
            vibrate: [300, 100, 300, 100, 300], // Telefon Titreşimi
            tag: 'task-alarm',
            renotify: true
          });
        });
      }
    }
  </script>
</body>
</html>
