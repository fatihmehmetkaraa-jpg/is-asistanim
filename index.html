<!DOCTYPE html>
<html lang="tr" class="h-full select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>İş Asistanım PRO</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8'
            }
          },
          animation: {
            fadeIn: 'fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            slideUp: 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards'
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'scale(0.98)' },
              '100%': { opacity: '1', transform: 'scale(1)' }
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(100%)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM Standalone CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.3);
      border-radius: 9999px;
    }
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body class="h-full bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased selection:bg-blue-500 selection:text-white">

  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const e = React.createElement;

    function App() {
      // --- EKRAN / TAB KONTROLÜ ---
      const [activeTab, setActiveTab] = useState("daily"); // daily, meetings, notes, search, profile

      // --- PIN KİLİT SİSTEMİ ---
      const [isLocked, setIsLocked] = useState(() => {
        return !!localStorage.getItem("app_pin");
      });
      const [pinInput, setPinInput] = useState("");
      const [pinError, setPinError] = useState(false);

      // --- TEMA MODLARI ---
      const [theme, setTheme] = useState(() => localStorage.getItem("app_theme") || "system");
      const [showThemeModal, setShowThemeModal] = useState(false);

      // --- PROFİL BİLGİLERİ ---
      const [profile, setProfile] = useState(() => {
        const saved = localStorage.getItem("app_profile");
        return saved ? JSON.parse(saved) : {
          fullName: "Mehmet Yılmaz",
          email: "mehmet@sirket.com",
          phone: "+90 532 123 45 67",
          avatar: null
        };
      });

      // --- GÜNLÜK GÖREVLER VERİSİ ---
      const [selectedDate, setSelectedDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem("app_tasks");
        return saved ? JSON.parse(saved) : [
          { id: "1", date: new Date().toISOString().split('T')[0], title: "Kalite Kontrol Raporu Hazırlanacak", category: "Üretim", priority: "Orta", time: "14:30", note: "Son verileri eklemeyi unutma", completed: false },
          { id: "2", date: new Date().toISOString().split('T')[0], title: "Haftalık Senkronizasyon Toplantısı", category: "Yönetim", priority: "Yüksek", time: "16:00", note: "Ekip sunumu yapılacak", completed: true }
        ];
      });

      // --- YENİ GÖREV MODALI STATE'LERİ ---
      const [showAddTaskModal, setShowAddTaskModal] = useState(false);
      const [newTaskTitle, setNewTaskTitle] = useState("");
      const [newTaskCategory, setNewTaskCategory] = useState("Üretim");
      const [newTaskPriority, setNewTaskPriority] = useState("Orta");
      const [newTaskTime, setNewTaskTime] = useState("");
      const [newTaskNote, setNewTaskNote] = useState("");
      const [newTaskImage, setNewTaskImage] = useState(null);

      // --- TOPLANTI NOTLARI VERİSİ ---
      const [meetingFolders, setMeetingFolders] = useState(() => {
        const saved = localStorage.getItem("app_meeting_folders");
        return saved ? JSON.parse(saved) : [
          {
            id: "f1",
            title: "Proje Alfa Lansmanı",
            date: "2026-07-20",
            sessions: [
              {
                id: "s1",
                title: "İlk Beyin Fırtınası",
                date: "2026-07-20",
                audioUrl: null,
                items: [
                  { id: "i1", type: "topic", content: "Lansman tarihi belirlendi", assignee: "Ahmet", completed: false },
                  { id: "i2", type: "decision", content: "Bütçe onaylandı", assignee: "Mehmet", completed: true },
                  { id: "i3", type: "task", content: "Sosyal medya görselleri hazırlanacak", assignee: "Ayşe", completed: false }
                ]
              }
            ]
          }
        ];
      });
      const [selectedFolderId, setSelectedFolderId] = useState(null);
      const [selectedSessionId, setSelectedSessionId] = useState(null);
      const [newFolderTitle, setNewFolderTitle] = useState("");
      const [newSessionTitle, setNewSessionTitle] = useState("");
      const [newItemContent, setNewItemContent] = useState("");
      const [newItemType, setNewItemType] = useState("topic"); // topic, decision, task
      const [newItemAssignee, setNewItemAssignee] = useState("");

      // --- NOTLAR (NOTES) VERİSİ ---
      const [notes, setNotes] = useState(() => {
        const saved = localStorage.getItem("app_notes");
        return saved ? JSON.parse(saved) : [
          { id: "n1", title: "Fikirler & Stratejiler", subtitle: "Q3 Pazarlama planları", body: "Sosyal medya bütçesi %20 artırılmalı.\nYeni video serisi başlatılacak.", image: null, createdAt: Date.now(), updatedAt: Date.now() }
        ];
      });
      const [selectedNote, setSelectedNote] = useState(null);
      const [isEditingNote, setIsEditingNote] = useState(false);
      const [newIosNoteTitle, setNewIosNoteTitle] = useState("");
      const [newIosNoteBody, setNewIosNoteBody] = useState("");
      const [noteImage, setNoteImage] = useState(null);
      const [noteSearchQuery, setNoteSearchQuery] = useState("");

      // --- GENEL ARAMA MODÜLÜ ---
      const [globalSearchQuery, setGlobalSearchQuery] = useState("");

      // --- SES KAYIT / SESLE YAZDIRMA STATE'LERİ ---
      const [isLiveListening, setIsLiveListening] = useState(false);
      const [activeVoiceTarget, setActiveVoiceTarget] = useState(null);
      const recognitionRef = useRef(null);

      const [isRecordingAudio, setIsRecordingAudio] = useState(false);
      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);

      // --- DOSYA YÜKLEME REF ---
      const avatarFileInputRef = useRef(null);

      // -------------------------------------------------------------
      // LOCALSTORAGE & THEME EFFECT'LERİ
      // -------------------------------------------------------------
      useEffect(() => {
        localStorage.setItem("app_tasks", JSON.stringify(tasks));
      }, [tasks]);

      useEffect(() => {
        localStorage.setItem("app_meeting_folders", JSON.stringify(meetingFolders));
      }, [meetingFolders]);

      useEffect(() => {
        localStorage.setItem("app_notes", JSON.stringify(notes));
      }, [notes]);

      useEffect(() => {
        localStorage.setItem("app_theme", theme);
        const root = document.documentElement;
        if (theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          root.classList.add("dark");
        } else {
          root.classList.remove("dark");
        }
      }, [theme]);

      const saveProfile = (updated) => {
        setProfile(updated);
        localStorage.setItem("app_profile", JSON.stringify(updated));
      };

      // -------------------------------------------------------------
      // PIN KONTROLÜ
      // -------------------------------------------------------------
      const handlePinSubmit = (val) => {
        const storedPin = localStorage.getItem("app_pin");
        if (val === storedPin) {
          setIsLocked(false);
          setPinInput("");
          setPinError(false);
        } else {
          setPinError(true);
          setPinInput("");
        }
      };

      const handleLogout = () => {
        if (confirm("Oturumu kapatmak istediğinize emin misiniz? PIN kilidi aktifleşecektir.")) {
          setIsLocked(true);
        }
      };

      // -------------------------------------------------------------
      // SESLE YAZDIRMA (SPEECH RECOGNITION)
      // -------------------------------------------------------------
      const startLiveListening = (targetField) => {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
          alert("Tarayıcınız sesle yazdırma özelliğini desteklemiyor.");
          return;
        }

        if (isLiveListening) {
          if (recognitionRef.current) recognitionRef.current.stop();
          setIsLiveListening(false);
          return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'tr-TR';
        recognition.continuous = false;
        recognition.interimResults = false;

        setActiveVoiceTarget(targetField);
        setIsLiveListening(true);

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          if (targetField === "taskTitle") setNewTaskTitle(prev => (prev ? prev + " " + transcript : transcript));
          else if (targetField === "taskNote") setNewTaskNote(prev => (prev ? prev + " " + transcript : transcript));
          else if (targetField === "meetingItem") setNewItemContent(prev => (prev ? prev + " " + transcript : transcript));
          else if (targetField === "noteBody") setNewIosNoteBody(prev => (prev ? prev + " " + transcript : transcript));
          else if (targetField === "globalSearch") setGlobalSearchQuery(transcript);
        };

        recognition.onerror = () => setIsLiveListening(false);
        recognition.onend = () => setIsLiveListening(false);

        recognitionRef.current = recognition;
        recognition.start();
      };

      // -------------------------------------------------------------
      // TOPLANTI SES KAYDI (MEDIA RECORDER)
      // -------------------------------------------------------------
      const toggleAudioRecording = () => {
        if (isRecordingAudio) {
          if (mediaRecorderRef.current) mediaRecorderRef.current.stop();
          setIsRecordingAudio(false);
        } else {
          navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
              const mediaRecorder = new MediaRecorder(stream);
              mediaRecorderRef.current = mediaRecorder;
              audioChunksRef.current = [];

              mediaRecorder.ondataavailable = (e) => audioChunksRef.current.push(e.data);
              mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/mp3' });
                const audioUrl = URL.createObjectURL(audioBlob);
                
                setMeetingFolders(prev => prev.map(folder => {
                  if (folder.id !== selectedFolderId) return folder;
                  return {
                    ...folder,
                    sessions: folder.sessions.map(s => {
                      if (s.id !== selectedSessionId) return s;
                      return { ...s, audioUrl };
                    })
                  };
                }));
              };

              mediaRecorder.start();
              setIsRecordingAudio(true);
            })
            .catch(() => alert("Mikrofon erişim izni alınamadı."));
        }
      };

      // -------------------------------------------------------------
      // GÖREV İŞLEMLERİ
      // -------------------------------------------------------------
      const handleSaveTask = () => {
        if (!newTaskTitle.trim()) {
          alert("Lütfen görev başlığı giriniz.");
          return;
        }

        const newTask = {
          id: Date.now().toString(),
          date: selectedDate,
          title: newTaskTitle.trim(),
          category: newTaskCategory,
          priority: newTaskPriority,
          time: newTaskTime,
          note: newTaskNote,
          image: newTaskImage,
          completed: false
        };

        setTasks([newTask, ...tasks]);
        setNewTaskTitle("");
        setNewTaskTime("");
        setNewTaskNote("");
        setNewTaskImage(null);
        setShowAddTaskModal(false);
      };

      const toggleTaskComplete = (id) => {
        setTasks(tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
      };

      const deleteTask = (id) => {
        setTasks(tasks.filter(t => t.id !== id));
      };

      const handleTaskImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setNewTaskImage(reader.result);
          reader.readAsDataURL(file);
        }
      };

      // -------------------------------------------------------------
      // TOPLANTI İŞLEMLERİ
      // -------------------------------------------------------------
      const handleCreateFolder = () => {
        if (!newFolderTitle.trim()) return;
        const newF = {
          id: Date.now().toString(),
          title: newFolderTitle.trim(),
          date: new Date().toISOString().split('T')[0],
          sessions: []
        };
        setMeetingFolders([newF, ...meetingFolders]);
        setNewFolderTitle("");
      };

      const handleCreateSession = (folderId) => {
        if (!newSessionTitle.trim()) return;
        const newS = {
          id: Date.now().toString(),
          title: newSessionTitle.trim(),
          date: new Date().toISOString().split('T')[0],
          audioUrl: null,
          items: []
        };
        setMeetingFolders(meetingFolders.map(f => {
          if (f.id === folderId) return { ...f, sessions: [...f.sessions, newS] };
          return f;
        }));
        setNewSessionTitle("");
      };

      const handleAddItemToSession = () => {
        if (!newItemContent.trim()) return;
        const newItem = {
          id: Date.now().toString(),
          type: newItemType,
          content: newItemContent.trim(),
          assignee: newItemAssignee.trim(),
          completed: false
        };

        setMeetingFolders(meetingFolders.map(f => {
          if (f.id !== selectedFolderId) return f;
          return {
            ...f,
            sessions: f.sessions.map(s => {
              if (s.id !== selectedSessionId) return s;
              return { ...s, items: [...s.items, newItem] };
            })
          };
        }));

        setNewItemContent("");
        setNewItemAssignee("");
      };

      const toggleSessionItemComplete = (folderId, sessionId, itemId) => {
        setMeetingFolders(meetingFolders.map(f => {
          if (f.id !== folderId) return f;
          return {
            ...f,
            sessions: f.sessions.map(s => {
              if (s.id !== sessionId) return s;
              return {
                ...s,
                items: s.items.map(it => it.id === itemId ? { ...it, completed: !it.completed } : it)
              };
            })
          };
        }));
      };

      // -------------------------------------------------------------
      // NOT İŞLEMLERİ
      // -------------------------------------------------------------
      const handleSaveNote = () => {
        if (!newIosNoteTitle.trim() && !newIosNoteBody.trim()) {
          setIsEditingNote(false);
          return;
        }

        if (selectedNote) {
          setNotes(notes.map(n => n.id === selectedNote.id ? {
            ...n,
            title: newIosNoteTitle || "Başlıksız Not",
            subtitle: newIosNoteBody.slice(0, 40) || "Detay yok",
            body: newIosNoteBody,
            image: noteImage,
            updatedAt: Date.now()
          } : n));
        } else {
          const newN = {
            id: Date.now().toString(),
            title: newIosNoteTitle || "Başlıksız Not",
            subtitle: newIosNoteBody.slice(0, 40) || "Detay yok",
            body: newIosNoteBody,
            image: noteImage,
            createdAt: Date.now(),
            updatedAt: Date.now()
          };
          setNotes([newN, ...notes]);
        }

        setIsEditingNote(false);
        setSelectedNote(null);
        setNewIosNoteTitle("");
        setNewIosNoteBody("");
        setNoteImage(null);
      };

      const deleteNote = (id) => {
        setNotes(notes.filter(n => n.id !== id));
        setIsEditingNote(false);
        setSelectedNote(null);
      };

      const handleNoteImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setNoteImage(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const getGroupedNotes = () => {
        const filtered = notes.filter(n => 
          n.title.toLowerCase().includes(noteSearchQuery.toLowerCase()) || 
          n.body.toLowerCase().includes(noteSearchQuery.toLowerCase())
        );

        const groups = { "Bugün": [], "Dün": [], "Öncekiler": [] };
        const now = new Date();
        const todayStr = now.toDateString();
        const yesterday = new Date(now);
        yesterday.setDate(yesterday.getDate() - 1);
        const yesterdayStr = yesterday.toDateString();

        filtered.forEach(note => {
          const d = new Date(note.updatedAt || note.createdAt).toDateString();
          if (d === todayStr) groups["Bugün"].push(note);
          else if (d === yesterdayStr) groups["Dün"].push(note);
          else groups["Öncekiler"].push(note);
        });

        if (groups["Bugün"].length === 0) delete groups["Bugün"];
        if (groups["Dün"].length === 0) delete groups["Dün"];
        if (groups["Öncekiler"].length === 0) delete groups["Öncekiler"];

        return groups;
      };

      // -------------------------------------------------------------
      // GENEL ARAMA MANTIĞI
      // -------------------------------------------------------------
      const getGlobalSearchResults = () => {
        const q = globalSearchQuery.toLowerCase().trim();
        if (!q) return { matchedTasks: [], matchedMeetingNotes: [], matchedNotes: [] };

        const matchedTasks = tasks.filter(t => t.title.toLowerCase().includes(q) || (t.note && t.note.toLowerCase().includes(q)));
        
        const matchedMeetingNotes = [];
        meetingFolders.forEach(f => {
          f.sessions.forEach(s => {
            s.items.forEach(it => {
              if (it.content.toLowerCase().includes(q) || (it.assignee && it.assignee.toLowerCase().includes(q))) {
                matchedMeetingNotes.push({ ...it, folderTitle: f.title, sessionTitle: s.title, folderId: f.id, sessionId: s.id });
              }
            });
          });
        });

        const matchedNotes = notes.filter(n => n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q));

        return { matchedTasks, matchedMeetingNotes, matchedNotes };
      };

      // -------------------------------------------------------------
      // GÖRÜNÜM: PIN KİLİT EKRANI
      // -------------------------------------------------------------
      if (isLocked) {
        return e("div", { className: "fixed inset-0 z-50 flex items-center justify-center bg-slate-950 text-white p-4" },
          e("div", { className: "w-full max-w-xs text-center space-y-6 animate-fadeIn" },
            e("div", { className: "w-16 h-16 bg-blue-600/20 text-blue-500 rounded-2xl flex items-center justify-center mx-auto text-2xl font-black border border-blue-500/30 shadow-lg shadow-blue-500/10" }, "🔒"),
            e("div", { className: "space-y-1" },
              e("h2", { className: "text-lg font-black tracking-tight" }, "Güvenlik Kilidi"),
              e("p", { className: "text-xs text-slate-400 font-medium" }, "Lütfen 4 haneli PIN kodunuzu girin")
            ),
            e("div", { className: "flex justify-center gap-2" },
              [0, 1, 2, 3].map(idx => e("div", {
                key: idx,
                className: `w-3.5 h-3.5 rounded-full border-2 transition-all duration-200 ${
                  pinInput.length > idx ? "bg-blue-500 border-blue-500 scale-110 shadow-md shadow-blue-500/50" : "border-slate-700"
                }`
              }))
            ),
            pinError && e("p", { className: "text-xs font-bold text-rose-500 animate-pulse" }, "Hatalı PIN! Tekrar deneyin."),
            e("div", { className: "grid grid-cols-3 gap-3 pt-2" },
              [1, 2, 3, 4, 5, 6, 7, 8, 9, "C", 0, "⌫"].map(btn => e("button", {
                key: btn,
                onClick: () => {
                  if (btn === "C") setPinInput("");
                  else if (btn === "⌫") setPinInput(prev => prev.slice(0, -1));
                  else if (typeof btn === "number" && pinInput.length < 4) {
                    const nextPin = pinInput + btn;
                    setPinInput(nextPin);
                    if (nextPin.length === 4) handlePinSubmit(nextPin);
                  }
                },
                className: "h-14 rounded-2xl bg-slate-900/80 hover:bg-slate-800 text-lg font-bold text-slate-200 active:scale-90 transition-all border border-slate-800/80 shadow-md flex items-center justify-center"
              }, btn))
            )
          )
        );
      }

      // -------------------------------------------------------------
      // ANA UYGULAMA DÜZENİ
      // -------------------------------------------------------------
      return e("div", { className: "flex flex-col h-full bg-slate-50 dark:bg-slate-950 max-w-md mx-auto shadow-2xl relative overflow-hidden" },
        
        /* GİZLİ AVATAR INPUT */
        e("input", {
          type: "file",
          ref: avatarFileInputRef,
          accept: "image/*",
          className: "hidden",
          onChange: (ev) => {
            const file = ev.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onloadend = () => saveProfile({ ...profile, avatar: reader.result });
              reader.readAsDataURL(file);
            }
          }
        }),

        /* TEMA SEÇİM MODALI */
        showThemeModal && e("div", { className: "fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 backdrop-blur-md p-4 animate-fadeIn" },
          e("div", { className: "w-full max-w-xs bg-white dark:bg-slate-900 rounded-3xl p-5 shadow-2xl border border-slate-200 dark:border-slate-800 space-y-4" },
            e("h3", { className: "font-black text-sm text-slate-900 dark:text-white" }, "🎨 Tema Tercihi"),
            e("div", { className: "space-y-2" },
              [
                { id: "light", label: "Aydınlık Mod ☀️" },
                { id: "dark", label: "Karanlık Mod 🌙" },
                { id: "system", label: "Sistem Varsayılanı ⚙️" }
              ].map(item => e("button", {
                key: item.id,
                onClick: () => { setTheme(item.id); setShowThemeModal(false); },
                className: `w-full p-3 rounded-2xl text-xs font-bold text-left transition-all ${
                  theme === item.id 
                    ? "bg-blue-600 text-white shadow-md shadow-blue-500/20" 
                    : "bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700"
                }`
              }, item.label))
            ),
            e("button", {
              onClick: () => setShowThemeModal(false),
              className: "w-full py-2.5 bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 font-bold rounded-xl text-xs active:scale-95 transition-all"
            }, "Kapat")
          )
        ),

        /* MODAL: YENİ GÖREV EKLEME */
        showAddTaskModal && e("div", {
          className: "fixed inset-0 z-50 flex items-end justify-center bg-slate-950/60 backdrop-blur-md transition-all duration-300 p-0 sm:p-4"
        },
          e("div", {
            className: "w-full max-w-md bg-white dark:bg-slate-900 rounded-t-[32px] sm:rounded-3xl p-6 shadow-2xl border border-slate-100 dark:border-slate-800 animate-slideUp space-y-4 max-h-[90vh] overflow-y-auto"
          },
            e("div", { className: "flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800" },
              e("h3", { className: "text-base font-extrabold text-slate-900 dark:text-white" }, "Yeni Görev Oluştur"),
              e("button", {
                onClick: () => setShowAddTaskModal(false),
                className: "w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400 hover:text-slate-700 dark:hover:text-white font-bold transition-colors"
              }, "✕")
            ),

            e("div", { className: "space-y-1.5" },

          activeTab === "notes" && e("div", { className: "space-y-3.5 animate-fadeIn" },
            e("div", { className: "space-y-3" },
              e("div", { className: "flex items-center justify-between" },
                e("h2", { className: "text-2xl font-black text-slate-900 dark:text-white tracking-tight" }, "Notlar"),
                e("span", { className: "text-xs font-semibold text-slate-400 block" }, `${notes.length} Not Kayıtlı`)
              ),

              e("div", { className: "flex gap-2" },
                e("div", { className: "relative flex-1" },
                  e("input", {
                    type: "text",
                    placeholder: "Notlarda Ara...",
                    value: noteSearchQuery,
                    onChange: (ev) => setNoteSearchQuery(ev.target.value),
                    className: "w-full pl-8 pr-3 py-2 bg-slate-200/60 dark:bg-slate-800/80 rounded-xl text-xs font-medium outline-none text-slate-800 dark:text-slate-100"
                  }),
                  e("span", { className: "absolute left-2.5 top-2.5 text-xs text-slate-400" }, "🔍")
                ),
                e("button", {
                  onClick: () => {
                    setSelectedNote(null);
                    setNewIosNoteTitle("");
                    setNewIosNoteBody("");
                    setNoteImage(null);
                    setIsEditingNote(true);
                  },
                  className: "px-3.5 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl text-xs shadow-md shadow-amber-500/20 flex items-center gap-1 active:scale-95 transition-all"
                }, "➕ Yeni Not")
              ),

              e("div", { className: "space-y-4 pt-1" },
                Object.keys(getGroupedNotes()).length === 0 ? e("div", { className: "text-center py-10 text-slate-400 space-y-2" },
                  e("div", { className: "text-3xl" }, "📝"),
                  e("p", { className: "text-xs font-bold" }, "Henüz hiç not eklenmemiş veya arama sonucu bulunamadı.")
                ) :
                Object.entries(getGroupedNotes()).map(([groupName, groupNotes]) => e("div", { key: groupName, className: "space-y-2" },
                  e("h4", { className: "text-xs font-black text-amber-600 dark:text-amber-400 px-1 uppercase tracking-wider" }, groupName),
                  e("div", { className: "bg-white/90 dark:bg-slate-900/90 backdrop-blur-xs border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden divide-y divide-slate-100 dark:divide-slate-800 shadow-xs" },
                    groupNotes.map(note => e("div", {
                      key: note.id,
                      onClick: () => {
                        setSelectedNote(note);
                        setNewIosNoteTitle(note.title || "");
                        setNewIosNoteBody(note.body || "");
                        setNoteImage(note.image || null);
                        setIsEditingNote(true);
                      },
                      className: "p-3 hover:bg-amber-50/50 dark:hover:bg-amber-950/20 cursor-pointer transition-colors flex items-center justify-between group"
                    },
                      e("div", { className: "space-y-0.5 flex-1 min-w-0 pr-2" },
                        e("h5", { className: "font-black text-xs text-slate-900 dark:text-white truncate" }, note.title || "Başlıksız Not"),
                        e("p", { className: "text-[11px] font-medium text-slate-500 dark:text-slate-400 truncate" }, note.subtitle || "Ek içerik yok"),
                        e("span", { className: "text-[9px] font-bold text-slate-400 block" }, new Date(note.updatedAt || note.createdAt || Date.now()).toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }))
                      ),
                      note.image ? e("img", { src: note.image, className: "w-10 h-10 object-cover rounded-lg border border-slate-200 dark:border-slate-700 shrink-0" }) :
                      e("span", { className: "text-slate-300 dark:text-slate-600 group-hover:text-amber-500 font-bold text-xs" }, "›")
                    ))
                  )
                ))
              )
            )
          ),

          /* 4. GENEL ARAMA TAB */
          activeTab === "search" && e("div", { className: "space-y-3 animate-fadeIn" },
            e("div", { className: "bg-white/95 dark:bg-slate-900/95 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-2.5 shadow-xs" },
              e("div", { className: "flex items-center justify-between" },
                e("h3", { className: "font-black text-xs text-slate-900 dark:text-white flex items-center gap-1.5" }, "🔍 Tüm İçeriklerde Arama"),
                e("button", {
                  onClick: () => startLiveListening("globalSearch"),
                  className: `px-2.5 py-1 rounded-lg text-[10px] font-extrabold border ${isLiveListening && activeVoiceTarget === "globalSearch" ? "bg-rose-500 text-white animate-pulse" : "bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200"}`
                }, "🎙️ Sesle Ara")
              ),
              e("div", { className: "relative" },
                e("input", {
                  type: "text",
                  placeholder: "Görev, toplantı, karar veya notlarda ara...",
                  value: globalSearchQuery,
                  onChange: (ev) => setGlobalSearchQuery(ev.target.value),
                  className: "w-full pl-8 pr-8 py-2 bg-slate-100 dark:bg-slate-800 border-0 rounded-xl text-xs font-semibold outline-none text-slate-800 dark:text-slate-100"
                }),
                e("span", { className: "absolute left-2.5 top-2.5 text-xs text-slate-400" }, "🔍"),
                globalSearchQuery && e("button", {
                  onClick: () => setGlobalSearchQuery(""),
                  className: "absolute right-2.5 top-2 text-xs font-bold text-slate-400 hover:text-slate-600"
                }, "✕")
              )
            ),

            globalSearchQuery.trim() !== "" && (() => {
              const { matchedTasks, matchedMeetingNotes, matchedNotes } = getGlobalSearchResults();
              const totalCount = matchedTasks.length + matchedMeetingNotes.length + matchedNotes.length;

              if (totalCount === 0) {
                return e("div", { className: "text-center py-10 text-slate-400 bg-white/50 dark:bg-slate-900/50 rounded-2xl border border-slate-200 dark:border-slate-800" },
                  e("div", { className: "text-3xl mb-1" }, "🔍"),
                  e("p", { className: "text-xs font-bold" }, `"${globalSearchQuery}" ile eşleşen sonuç bulunamadı.`)
                );
              }

              return e("div", { className: "space-y-3" },
                matchedTasks.length > 0 && e("div", { className: "space-y-1.5" },
                  e("h4", { className: "text-xs font-black text-blue-600 dark:text-blue-400 px-1" }, `✅ Görevler (${matchedTasks.length})`),
                  matchedTasks.map(task => e("div", {
                    key: task.id,
                    onClick: () => { setSelectedDate(task.date); setActiveTab("daily"); },
                    className: "p-2.5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-between cursor-pointer hover:border-blue-500 shadow-xs"
                  },
                    e("div", { className: "space-y-0.5" },
                      e("span", { className: `text-xs font-bold ${task.completed ? "line-through text-slate-400" : "text-slate-800 dark:text-slate-100"}` }, task.title),
                      e("div", { className: "flex items-center gap-2 text-[9px] text-slate-400 font-semibold" },
                        e("span", null, `📅 ${task.date}`),
                        e("span", null, `🏷️ ${task.category || 'Genel'}`)
                      )
                    ),
                    e("span", { className: "text-[10px] font-bold text-blue-600" }, "Git ➔")
                  ))
                ),

                matchedMeetingNotes.length > 0 && e("div", { className: "space-y-1.5" },
                  e("h4", { className: "text-xs font-black text-indigo-600 dark:text-indigo-400 px-1" }, `💼 Toplantı Notları (${matchedMeetingNotes.length})`),
                  matchedMeetingNotes.map(item => e("div", {
                    key: item.id,
                    onClick: () => { setSelectedFolderId(item.folderId); setSelectedSessionId(item.sessionId); setActiveTab("meetings"); },
                    className: "p-2.5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-between cursor-pointer hover:border-indigo-500 shadow-xs"
                  },
                    e("div", { className: "space-y-0.5 flex-1 pr-2" },
                      e("span", { className: "text-xs font-bold text-slate-800 dark:text-slate-100 block" }, item.content),
                      e("div", { className: "flex items-center gap-2 text-[9px] text-slate-400 font-semibold" },
                        e("span", null, `📂 ${item.folderTitle} / ${item.sessionTitle}`),
                        e("span", null, `👤 ${item.assignee}`)
                      )
                    ),
                    e("span", { className: "text-[10px] font-bold text-indigo-600" }, "Git ➔")
                  ))
                ),

                matchedNotes.length > 0 && e("div", { className: "space-y-1.5" },
                  e("h4", { className: "text-xs font-black text-amber-600 dark:text-amber-400 px-1" }, `📝 Notlar (${matchedNotes.length})`),
                  matchedNotes.map(note => e("div", {
                    key: note.id,
                    onClick: () => {
                      setSelectedNote(note);
                      setNewIosNoteTitle(note.title || "");
                      setNewIosNoteBody(note.body || "");
                      setNoteImage(note.image || null);
                      setIsEditingNote(true);
                      setActiveTab("notes");
                    },
                    className: "p-2.5 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-between cursor-pointer hover:border-amber-500 shadow-xs"
                  },
                    e("div", { className: "space-y-0.5 flex-1 pr-2" },
                      e("span", { className: "text-xs font-bold text-slate-800 dark:text-slate-100 block" }, note.title || "Başlıksız Not"),
                      e("p", { className: "text-[10px] text-slate-500 truncate" }, note.subtitle || "Ek detay...")
                    ),
                    e("span", { className: "text-[10px] font-bold text-amber-600" }, "Aç ➔")
                  ))
                )
              );
            })()
          ),

          /* 5. PROFİL & AYARLAR TAB */
          activeTab === "profile" && e("div", { className: "space-y-3 animate-fadeIn" },
            
            e("div", { className: "p-4 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xs rounded-3xl border border-slate-200 dark:border-slate-800 space-y-4 shadow-sm text-center" },
              e("div", { className: "relative w-20 h-20 mx-auto" },
                e("div", { className: "w-20 h-20 rounded-full bg-blue-600 text-white font-black text-2xl flex items-center justify-center overflow-hidden border-2 border-blue-500 shadow-md shadow-blue-500/20" },
                  profile.avatar ? e("img", { src: profile.avatar, className: "w-full h-full object-cover" }) : profile.fullName.charAt(0)
                ),
                e("button", {
                  onClick: () => avatarFileInputRef.current && avatarFileInputRef.current.click(),
                  className: "absolute bottom-0 right-0 bg-blue-600 text-white p-1.5 rounded-full text-xs shadow-lg hover:scale-105 active:scale-95 transition-all"
                }, "📷")
              ),

              e("div", { className: "space-y-1" },
                e("h3", { className: "font-black text-sm text-slate-900 dark:text-white" }, profile.fullName),
                e("p", { className: "text-xs font-medium text-slate-400" }, profile.email)
              ),

              e("div", { className: "pt-2 border-t dark:border-slate-800 grid grid-cols-2 gap-2" },
                e("button", {
                  onClick: () => setShowThemeModal(true),
                  className: "py-2.5 px-3 bg-slate-100 dark:bg-slate-800 rounded-xl text-xs font-bold text-slate-700 dark:text-slate-200 flex items-center justify-center gap-1.5 active:scale-95 transition-all"
                }, "🎨 Tema Seç"),
                
                e("button", {
                  onClick: () => {
                    const newPin = prompt("Yeni 4 Haneli PIN Kodunuzu Girin:");
                    if (newPin && newPin.trim()) {
                      localStorage.setItem("app_pin", newPin.trim());
                      alert("Güvenlik PIN kodunuz güncellendi!");
                    }
                  },
                  className: "py-2.5 px-3 bg-slate-100 dark:bg-slate-800 rounded-xl text-xs font-bold text-slate-700 dark:text-slate-200 flex items-center justify-center gap-1.5 active:scale-95 transition-all"
                }, "🔑 PIN Değiştir")
              )
            ),

            e("div", { className: "p-4 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xs rounded-3xl border border-slate-200 dark:border-slate-800 space-y-3 shadow-sm" },
              e("h4", { className: "font-black text-xs text-slate-900 dark:text-white border-b pb-2 dark:border-slate-800" }, "⚙️ Profil Bilgilerini Düzenle"),
              
              e("div", { className: "space-y-2 text-xs" },
                e("div", null,
                  e("label", { className: "text-[10px] font-bold text-slate-400 block mb-1" }, "Ad Soyad"),
                  e("input", {
                    type: "text",
                    value: profile.fullName,
                    onChange: (ev) => saveProfile({ ...profile, fullName: ev.target.value }),
                    className: "w-full p-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none font-semibold text-slate-800 dark:text-slate-100 focus:border-blue-500"
                  })
                ),

                e("div", null,
                  e("label", { className: "text-[10px] font-bold text-slate-400 block mb-1" }, "E-Posta Adresi"),
                  e("input", {
                    type: "email",
                    value: profile.email,
                    onChange: (ev) => saveProfile({ ...profile, email: ev.target.value }),
                    className: "w-full p-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none font-semibold text-slate-800 dark:text-slate-100 focus:border-blue-500"
                  })
                ),

                e("div", null,
                  e("label", { className: "text-[10px] font-bold text-slate-400 block mb-1" }, "Telefon"),
                  e("input", {
                    type: "text",
                    value: profile.phone,
                    onChange: (ev) => saveProfile({ ...profile, phone: ev.target.value }),
                    className: "w-full p-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none font-semibold text-slate-800 dark:text-slate-100 focus:border-blue-500"
                  })
                )
              )
            ),

            e("button", {
              onClick: handleLogout,
              className: "w-full py-3.5 bg-rose-600 hover:bg-rose-500 text-white rounded-2xl text-xs font-black shadow-md shadow-rose-600/20 active:scale-98 transition-all flex items-center justify-center gap-2"
            }, "🚪 Oturumu Kapat")
          )
        ),

        /* TAB BAR (ALT GEZİNTİ MENÜSÜ) */
        e("nav", { className: "fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border-t border-slate-200/80 dark:border-slate-800/80 p-2 z-40 flex items-center justify-around shadow-2xl" },
          [
            { id: "daily", label: "Günlük", icon: "📅" },
            { id: "meetings", label: "Toplantı", icon: "💼" },
            { id: "notes", label: "Notlar", icon: "📝" },
            { id: "search", label: "Arama", icon: "🔍" },
            { id: "profile", label: "Profil", icon: "👤" }
          ].map(tab => {
            const isActive = activeTab === tab.id;
            return e("button", {
              key: tab.id,
              onClick: () => {
                if (tab.id === "notes") setIsEditingNote(false);
                setActiveTab(tab.id);
              },
              className: `flex flex-col items-center gap-0.5 py-1 px-3 rounded-2xl transition-all ${
                isActive 
                  ? "text-blue-600 dark:text-blue-400 font-black scale-105" 
                  : "text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 font-semibold"
              }`
            },
              e("span", { className: "text-lg leading-none" }, tab.icon),
              e("span", { className: "text-[10px]" }, tab.label)
            );
          })
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(e(App));
  </script>
</body>
</html>
