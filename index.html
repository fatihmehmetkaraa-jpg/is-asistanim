<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kişisel Verimlilik Paneli</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-bg: rgba(255, 255, 255, 0.75);
            --accent-color: #0071e3;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --border-color: rgba(220, 220, 225, 0.6);
            --radius: 16px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            margin: 20px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: rgba(240, 240, 245, 0.5);
            padding: 24px;
            border-right: 1px solid var(--border-color);
        }

        .profile-section {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border: none;
            background: transparent;
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .nav-btn:hover { background: rgba(0, 0, 0, 0.05); }

        .nav-btn.active {
            background: var(--accent-color);
            color: white;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .section-header h1 {
            font-size: 28px;
            font-weight: 600;
        }

        .date-badge {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Cards & Forms */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .add-card {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .flex-col { flex-direction: column; align-items: stretch; }

        input[type="text"], textarea, select {
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.8);
            outline: none;
            font-size: 14px;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            border-color: var(--accent-color);
        }

        .task-input-field { flex: 1; min-width: 200px; }

        .small-select {
            padding: 10px;
            font-size: 13px;
            border-radius: 8px;
            background: white;
        }

        .apple-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .apple-btn:hover { opacity: 0.9; }

        /* Ses Kayıt Butonu */
        .mic-btn {
            background: #e5e5ea;
            color: var(--text-primary);
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mic-btn.recording {
            background: #ff3b30;
            color: white;
        }

        /* Lists & Badges */
        .apple-list { list-style: none; }

        .apple-list li {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            margin-right: 8px;
        }
        .badge-type { background: #e5e5ea; color: #3a3a3c; }
        .badge-high { background: #ffe5e5; color: #ff3b30; }
        .badge-medium { background: #fff4e5; color: #ff9500; }
        .badge-low { background: #e5f9e5; color: #34c759; }

        /* File Upload */
        .file-upload-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 12px 0;
        }

        .file-label {
            background: #e5e5ea;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }

        #note-file { display: none; }
        #file-name-display { font-size: 13px; color: var(--text-secondary); }

        /* Calendar */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
            margin-top: 16px;
        }

        .calendar-day {
            padding: 14px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }

        .calendar-day.today {
            background: var(--accent-color);
            color: white;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .app-container { flex-direction: column; margin: 0; border-radius: 0; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border-color); }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="profile-section">
                <div class="avatar"><i class="fa-solid fa-user"></i></div>
                <h2>Verimlilik Paneli</h2>
            </div>
            <nav class="nav-menu">
                <button class="nav-btn active" onclick="switchTab('tasks', this)">
                    <i class="fa-solid fa-check-square"></i> Görevler
                </button>
                <button class="nav-btn" onclick="switchTab('calendar', this)">
                    <i class="fa-solid fa-calendar-days"></i> Takvim
                </button>
                <button class="nav-btn" onclick="switchTab('notes', this)">
                    <i class="fa-solid fa-note-sticky"></i> Toplantı Notları
                </button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            
            <!-- GÖREVLER -->
            <section id="tasks" class="tab-content active">
                <header class="section-header">
                    <h1>Görevler</h1>
                    <span class="date-badge" id="current-date"></span>
                </header>

                <div class="card add-card">
                    <input type="text" id="task-input" class="task-input-field" placeholder="Yeni bir görev ekleyin...">
                    
                    <!-- Tür Seçimi -->
                    <select id="task-type" class="small-select">
                        <option value="Genel">Genel</option>
                        <option value="Üretim">Üretim</option>
                        <option value="Kalite">Kalite</option>
                        <option value="Yönetim">Yönetim</option>
                    </select>

                    <!-- Öncelik Seçimi -->
                    <select id="task-prio" class="small-select">
                        <option value="low">Düşük Öncelik</option>
                        <option value="medium" selected>Orta Öncelik</option>
                        <option value="high">Yüksek Öncelik</option>
                    </select>

                    <button class="mic-btn" id="task-mic-btn" onclick="toggleSpeech('task-input', 'task-mic-btn')">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    
                    <button class="apple-btn" onclick="addTask()">Ekle</button>
                </div>

                <ul id="task-list" class="apple-list"></ul>
            </section>

            <!-- TAKVİM -->
            <section id="calendar" class="tab-content">
                <header class="section-header">
                    <h1>Takvim & Etkinlikler</h1>
                </header>
                <div class="card">
                    <div class="calendar-header">
                        <h3 id="calendar-month-year"></h3>
                    </div>
                    <div class="calendar-grid" id="calendar-grid"></div>
                </div>
            </section>

            <!-- TOPLANTI NOTLARI -->
            <section id="notes" class="tab-content">
                <header class="section-header">
                    <h1>Toplantı Notları</h1>
                </header>
                
                <div class="card add-card flex-col">
                    <input type="text" id="note-title" placeholder="Toplantı Başlığı" style="width: 100%;">
                    <textarea id="note-body" placeholder="Notlarınızı buraya yazın..." rows="4" style="width: 100%;"></textarea>
                    
                    <div class="file-upload-wrapper">
                        <button class="mic-btn" id="note-mic-btn" onclick="toggleSpeech('note-body', 'note-mic-btn')">
                            <i class="fa-solid fa-microphone"></i> Sesle Yazdır
                        </button>
                        <label for="note-file" class="file-label">
                            <i class="fa-solid fa-paperclip"></i> Fotoğraf veya Ek Ekle
                        </label>
                        <input type="file" id="note-file" accept="image/*,application/pdf" onchange="handleFileSelect(event)">
                        <span id="file-name-display">Dosya seçilmedi</span>
                    </div>

                    <button class="apple-btn" style="align-self: flex-end;" onclick="addNote()">Notu Kaydet</button>
                </div>

                <div id="notes-list"></div>
            </section>

        </main>
    </div>

    <script>
        // Tarih
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('tr-TR', {
            weekday: 'long', day: 'numeric', month: 'long'
        });

        // Sekmeler
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
            if(tabId === 'calendar') renderCalendar();
        }

        // Canlı Ses Tanıma & Otomatik Kapanma
        let recognition = null;
        let isRecording = false;

        function toggleSpeech(targetId, btnId) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Tarayıcınız sesle yazmayı desteklemiyor.");
                return;
            }

            const inputEl = document.getElementById(targetId);
            const btnEl = document.getElementById(btnId);

            if (isRecording) {
                stopSpeech(btnEl);
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'tr-TR';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onstart = function() {
                isRecording = true;
                btnEl.classList.add('recording');
            };

            recognition.onresult = function(e) {
                let text = '';
                for (let i = 0; i < e.results.length; i++) {
                    text += e.results[i][0].transcript;
                }
                inputEl.value = text;
            };

            recognition.onerror = function() { stopSpeech(btnEl); };
            recognition.onend = function() { stopSpeech(btnEl); };

            recognition.start();
        }

        function stopSpeech(btnEl) {
            if (recognition) {
                recognition.stop();
                recognition = null;
            }
            isRecording = false;
            if (btnEl) btnEl.classList.remove('recording');
        }

        // Görevler
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

        function renderTasks() {
            const list = document.getElementById('task-list');
            list.innerHTML = '';
            tasks.forEach((t, i) => {
                const prioLabel = t.prio === 'high' ? 'Yüksek' : (t.prio === 'medium' ? 'Orta' : 'Düşük');
                const prioClass = `badge-${t.prio || 'medium'}`;
                const typeText = t.type || 'Genel';

                list.innerHTML += `
                    <li>
                        <div>
                            <span class="badge badge-type">${typeText}</span>
                            <span class="badge ${prioClass}">${prioLabel}</span>
                            <span>${t.text}</span>
                        </div>
                        <button onclick="deleteTask(${i})" style="border:none; background:none; color:#ff3b30; cursor:pointer;">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </li>`;
            });
        }

        function addTask() {
            const input = document.getElementById('task-input');
            const type = document.getElementById('task-type').value;
            const prio = document.getElementById('task-prio').value;

            if (input.value.trim() !== '') {
                tasks.push({ text: input.value.trim(), type: type, prio: prio });
                localStorage.setItem('tasks', JSON.stringify(tasks));
                input.value = '';
                renderTasks();
            }
        }

        function deleteTask(i) {
            tasks.splice(i, 1);
            localStorage.setItem('tasks', JSON.stringify(tasks));
            renderTasks();
        }

        // Notlar
        let selectedFileBase64 = '';
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('file-name-display').innerText = file.name;
                const r = new FileReader();
                r.onload = (ev) => selectedFileBase64 = ev.target.result;
                r.readAsDataURL(file);
            }
        }

        let notes = JSON.parse(localStorage.getItem('notes')) || [];
        function renderNotes() {
            const container = document.getElementById('notes-list');
            container.innerHTML = '';
            notes.forEach((n) => {
                let img = n.file ? `<div style="margin-top:10px;"><img src="${n.file}" style="max-width:100%; border-radius:8px;"></div>` : '';
                container.innerHTML += `
                    <div class="card">
                        <h3>${n.title}</h3>
                        <p style="margin-top:8px; color:#3a3a3c;">${n.body}</p>
                        ${img}
                        <small style="color:#86868b; display:block; margin-top:10px;">${n.date}</small>
                    </div>`;
            });
        }

        function addNote() {
            const title = document.getElementById('note-title').value.trim();
            const body = document.getElementById('note-body').value.trim();
            if (title && body) {
                notes.push({ title, body, file: selectedFileBase64, date: new Date().toLocaleString('tr-TR') });
                localStorage.setItem('notes', JSON.stringify(notes));
                document.getElementById('note-title').value = '';
                document.getElementById('note-body').value = '';
                document.getElementById('file-name-display').innerText = 'Dosya seçilmedi';
                selectedFileBase64 = '';
                renderNotes();
            }
        }

        // Takvim
        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const monthYear = document.getElementById('calendar-month-year');
            grid.innerHTML = '';
            const now = new Date();
            monthYear.innerText = now.toLocaleDateString('tr-TR', { month: 'long', year: 'numeric' });
            const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            for (let i = 1; i <= daysInMonth; i++) {
                const today = i === now.getDate() ? 'today' : '';
                grid.innerHTML += `<div class="calendar-day ${today}">${i}</div>`;
            }
        }

        renderTasks();
        renderNotes();
    </script>
</body>
</html>
