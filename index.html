<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased min-h-screen select-none overflow-x-hidden">
  <div id="root"></div>

  <script>
    const e = React.createElement;
    const { useState, useEffect, useRef } = React;

    const getLocalDateISO = (dateObj = new Date()) => {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const compressImage = (file, maxWidth = 800, quality = 0.7, callback) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
          callback(compressedDataUrl);
        };
      };
    };

    const playAlarmSound = () => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        
        const playBeep = (freq, duration, delay) => {
          setTimeout(() => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + duration);
            osc.stop(ctx.currentTime + duration);
          }, delay);
        };

        playBeep(880, 0.2, 0);
        playBeep(880, 0.2, 250);
        playBeep(1200, 0.4, 500);
      } catch(err) {
        console.log("Ses hatası:", err);
      }
    };

    function App() {
      const todayISO = getLocalDateISO();

      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        return localStorage.getItem("app_authenticated") === "true";
      });
      const [inputPin, setInputPin] = useState("");

      const [profile, setProfile] = useState(() => {
        const saved = localStorage.getItem("user_profile");
        return saved ? JSON.parse(saved) : {
          fullName: "Yönetici Kullanıcı",
          email: "admin@sirket.com",
          phone: "+90 555 000 0000",
          avatar: null
        };
      });

      const [darkMode, setDarkMode] = useState(() => localStorage.getItem("app_dark_mode") === "true");
      const [bgStyleType, setBgStyleType] = useState(() => localStorage.getItem("app_bg_type") || "default");
      const [customBgUrl, setCustomBgUrl] = useState(() => localStorage.getItem("app_bg_custom") || "");
      const [customBgColor, setCustomBgColor] = useState(() => localStorage.getItem("app_bg_color") || "#0f172a");
      const [showThemeModal, setShowThemeModal] = useState(false);

      const [activeTab, setActiveTab] = useState("daily");
      const [selectedDate, setSelectedDate] = useState(todayISO);
      const [selectedFolderId, setSelectedFolderId] = useState(null);
      const [selectedSessionId, setSelectedSessionId] = useState(null);

      const [notes, setNotes] = useState([]);
      const [noteSearchQuery, setNoteSearchQuery] = useState("");
      const [selectedNote, setSelectedNote] = useState(null);
      const [isEditingNote, setIsEditingNote] = useState(false);
      const [newIosNoteTitle, setNewIosNoteTitle] = useState("");
      const [newIosNoteBody, setNewIosNoteBody] = useState("");
      const [noteImage, setNoteImage] = useState(null);
      const [showNoteOptionsMenu, setShowNoteOptionsMenu] = useState(false);
      const noteFileInputRef = useRef(null);

      const [activeToolbarMenu, setActiveToolbarMenu] = useState(null);
      const [activeTextStyle, setActiveTextStyle] = useState("Gövde");
      const editorAreaRef = useRef(null);

      // CANVAS (ÇİZİM)
      const [showCanvasModal, setShowCanvasModal] = useState(false);
      const [canvasColor, setCanvasColor] = useState("#000000");
      const [canvasLineWidth, setCanvasLineWidth] = useState(3);
      const [isDrawing, setIsDrawing] = useState(false);
      const canvasRef = useRef(null);

      const touchStartX = useRef(0);
      const touchEndX = useRef(0);

      const [previewImageUrl, setPreviewImageUrl] = useState(null);
      const [editingItem, setEditingItem] = useState(null);

      const taskFileInputRef = useRef(null);
      const meetingFileInputRef = useRef(null);
      const bgFileInputRef = useRef(null);
      const avatarFileInputRef = useRef(null);

      const [selectedTaskImage, setSelectedTaskImage] = useState(null);
      const [selectedMeetingImage, setSelectedMeetingImage] = useState(null);

      const [taskAudioBlob, setTaskAudioBlob] = useState(null);
      const [meetingAudioBlob, setMeetingAudioBlob] = useState(null);

      const [speechTarget, setSpeechTarget] = useState(null);
      const [showAudioMenu, setShowAudioMenu] = useState(null);
      const [isLiveListening, setIsLiveListening] = useState(false);
      const [isRecordingAudio, setIsRecordingAudio] = useState(false);

      const recognitionRef = useRef(null);
      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);

      const [tasks, setTasks] = useState([]);
      const [meetingTopics, setMeetingTopics] = useState([]);

      const [showAddForm, setShowAddForm] = useState(false);
      const [newTaskTitle, setNewTaskTitle] = useState("");
      const [newTaskPriority, setNewTaskPriority] = useState("Yüksek");
      const [newTaskCategory, setNewTaskCategory] = useState("Üretim");
      const [newTaskBgColor, setNewTaskBgColor] = useState("#ffffff");
      const [newTaskAlarm, setNewTaskAlarm] = useState("");
      const [newTaskAlarmType, setNewTaskAlarmType] = useState("both");

      const [newMeetingTitle, setNewMeetingTitle] = useState("");
      const [newSessionDate, setNewSessionDate] = useState(todayISO);
      const [newNoteContent, setNewNoteContent] = useState("");
      const [newNoteAssignee, setNewNoteAssignee] = useState("");

      const [isSyncing, setIsSyncing] = useState(true);

      const generateDateList = () => {
        const dates = [];
        const base = new Date();
        for (let i = -3; i <= 7; i++) {
          const d = new Date(base);
          d.setDate(base.getDate() + i);
          const iso = getLocalDateISO(d);
          const dayName = d.toLocaleDateString("tr-TR", { weekday: "short" });
          const dayNum = d.getDate();
          dates.push({ iso, dayName, dayNum });
        }
        return dates;
      };

      const dateList = generateDateList();

      const saveProfile = (newProf) => {
        setProfile(newProf);
        localStorage.setItem("user_profile", JSON.stringify(newProf));
      };

      useEffect(() => {
        if (darkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        localStorage.setItem("app_dark_mode", darkMode.toString());
      }, [darkMode]);

      useEffect(() => {
        if ("Notification" in window && Notification.permission !== "granted") {
          Notification.requestPermission();
        }
      }, []);

      useEffect(() => {
        const interval = setInterval(() => {
          const nowStr = new Date().toISOString().slice(0, 16);
          tasks.forEach(task => {
            if (task.alarmTime && task.alarmTime === nowStr && !task.completed && !task.alarmNotified) {
              const type = task.alarmType || "both";
              if (type === "sound" || type === "both") playAlarmSound();
              if ((type === "vibrate" || type === "both") && "vibrate" in navigator) {
                navigator.vibrate([300, 100, 300, 100, 500]);
              }

              if ("Notification" in window && Notification.permission === "granted") {
                new Notification("İş Asistanım PRO ⏰", {
                  body: `Hatırlatma: ${task.title}`,
                  icon: profile.avatar || "⚡"
                });
              } else {
                alert(`⏰ ALARM: ${task.title}`);
              }

              saveTaskToFirebase({ ...task, alarmNotified: true });
            }
          });
        }, 15000);
        return () => clearInterval(interval);
      }, [tasks, profile]);

      useEffect(() => {
        let unsubTasks, unsubTopics, unsubNotes;

        const checkDb = setInterval(() => {
          if (window.db && window.dbFuncs) {
            clearInterval(checkDb);
            const { collection, onSnapshot } = window.dbFuncs;

            unsubTasks = onSnapshot(collection(window.db, "tasks"), (snapshot) => {
              const loadedTasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              
              const currentTodayISO = getLocalDateISO();
              const updatedTasks = loadedTasks.map(task => {
                if (!task.completed && task.date < currentTodayISO) {
                  const rolledTask = { ...task, date: currentTodayISO, isRollover: true };
                  saveTaskToFirebase(rolledTask);
                  return rolledTask;
                }
                return task;
              });

              setTasks(updatedTasks);
              setIsSyncing(false);
            });

            unsubTopics = onSnapshot(collection(window.db, "topics"), (snapshot) => {
              const loadedTopics = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setMeetingTopics(loadedTopics);
            });

            unsubNotes = onSnapshot(collection(window.db, "notes"), (snapshot) => {
              const loadedNotes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setNotes(loadedNotes);
            });
          }
        }, 200);

        return () => {
          clearInterval(checkDb);
          if (unsubTasks) unsubTasks();
          if (unsubTopics) unsubTopics();
          if (unsubNotes) unsubNotes();
        };
      }, []);

      const handleTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
      const handleTouchEnd = (e) => {
        touchEndX.current = e.changedTouches[0].clientX;
        const diff = touchStartX.current - touchEndX.current;

        if (Math.abs(diff) > 70) {
          if (diff > 0) {
            if (activeTab === "daily") setActiveTab("meetings");
            else if (activeTab === "meetings") setActiveTab("notes");
            else if (activeTab === "notes") setActiveTab("profile");
          } else {
            if (activeTab === "profile") setActiveTab("notes");
            else if (activeTab === "notes") setActiveTab("meetings");
            else if (activeTab === "meetings") setActiveTab("daily");
          }
        }
      };

      const handleAuthSubmit = () => {
        const storedPin = localStorage.getItem("app_pin");
        if (!storedPin) {
          if (!inputPin.trim()) return alert("Lütfen bir PIN belirleyin.");
          localStorage.setItem("app_pin", inputPin);
          localStorage.setItem("app_authenticated", "true");
          setIsAuthenticated(true);
        } else {
          if (inputPin === storedPin) {
            localStorage.setItem("app_authenticated", "true");
            setIsAuthenticated(true);
          } else {
            alert("Hatalı PIN!");
          }
        }
      };

      const handleLogout = () => {
        localStorage.removeItem("app_authenticated");
        setIsAuthenticated(false);
      };

      const changeBgType = (type, color = null) => {
        setBgStyleType(type);
        localStorage.setItem("app_bg_type", type);
        if (color) {
          setCustomBgColor(color);
          localStorage.setItem("app_bg_color", color);
        }
      };

      const startLiveListening = (target) => {
        if (!("webkitSpeechRecognition" in window) && !("SpeechRecognition" in window)) {
          return alert("Tarayıcınız ses tanıma özelliğini desteklemiyor.");
        }

        stopAllAudioControls();
        setSpeechTarget(target);
        setIsLiveListening(true);

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = "tr-TR";
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onresult = (event) => {
          let currentText = "";
          for (let i = event.resultIndex; i < event.results.length; ++i) {
            currentText += event.results[i][0].transcript;
          }
          if (target === "task") {
            setNewTaskTitle(currentText);
            setShowAddForm(true);
          } else if (target === "note") {
            setNewNoteContent(currentText);
          } else if (target === "iosNote") {
            setNewIosNoteBody(prev => (prev ? prev + " " + currentText : currentText));
          }
        };

        recognition.onerror = () => stopAllAudioControls();
        recognition.onend = () => setIsLiveListening(false);

        recognitionRef.current = recognition;
        recognition.start();
      };

      const startAudioRecording = (target) => {
        stopAllAudioControls();
        setSpeechTarget(target);

        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
          const options = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
            ? { mimeType: 'audio/webm;codecs=opus' }
            : {};
          const mediaRecorder = new MediaRecorder(stream, options);
          mediaRecorderRef.current = mediaRecorder;
          audioChunksRef.current = [];

          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunksRef.current.push(e.data);
          };

          mediaRecorder.onstop = () => {
            const mimeType = mediaRecorder.mimeType || 'audio/webm';
            const audioBlob = new Blob(audioChunksRef.current, { type: mimeType });
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = () => {
              const base64Audio = reader.result;
              if (target === "task") {
                setTaskAudioBlob(base64Audio);
                setShowAddForm(true);
              } else if (target === "note") {
                setMeetingAudioBlob(base64Audio);
              }
            };
            stream.getTracks().forEach(track => track.stop());
          };

          mediaRecorder.start();
          setIsRecordingAudio(true);
        }).catch(err => alert("Mikrofon izni alınamadı: " + err));
      };

      const stopAllAudioControls = () => {
        if (recognitionRef.current) {
          recognitionRef.current.stop();
          recognitionRef.current = null;
        }
        if (mediaRecorderRef.current && isRecordingAudio) {
          mediaRecorderRef.current.stop();
          mediaRecorderRef.current = null;
        }
        setIsLiveListening(false);
        setIsRecordingAudio(false);
        setShowAudioMenu(null);
      };

      const saveTaskToFirebase = async (taskObj) => {
        if (!window.db) return;
        const { doc, setDoc } = window.dbFuncs;
        await setDoc(doc(window.db, "tasks", taskObj.id), taskObj);
      };

      const deleteTaskFromFirebase = async (id) => {
        if (!window.db) return;
        const { doc, deleteDoc } = window.dbFuncs;
        await deleteDoc(doc(window.db, "tasks", id));
      };

      const saveTopicToFirebase = async (topicObj) => {
        if (!window.db) return;
        const { doc, setDoc } = window.dbFuncs;
        await setDoc(doc(window.db, "topics", topicObj.id), topicObj);
      };

      const saveNoteToFirebase = async (noteObj) => {
        if (!window.db) return;
        const { doc, setDoc } = window.dbFuncs;
        await setDoc(doc(window.db, "notes", noteObj.id), noteObj);
      };

      const deleteNoteFromFirebase = async (id) => {
        if (!window.db) return;
        const { doc, deleteDoc } = window.dbFuncs;
        await deleteDoc(doc(window.db, "notes", id));
      };

      const executeFormatCommand = (command, value = null) => {
        document.execCommand(command, false, value);
      };

      const insertTableIntoNote = () => {
        const tableHtml = `
          <table style="width: 100%; border-collapse: collapse; margin: 8px 0; border: 1px solid #cbd5e1;">
            <tbody>
              <tr><td style="border: 1px solid #cbd5e1; padding: 6px; font-size: 12px;">Hücre 1</td><td style="border: 1px solid #cbd5e1; padding: 6px; font-size: 12px;">Hücre 2</td></tr>
              <tr><td style="border: 1px solid #cbd5e1; padding: 6px; font-size: 12px;">Hücre 3</td><td style="border: 1px solid #cbd5e1; padding: 6px; font-size: 12px;">Hücre 4</td></tr>
            </tbody>
          </table><br/>
        `;
        executeFormatCommand("insertHTML", tableHtml);
      };

      const addLinkToNote = () => {
        const url = prompt("Eklenecek Bağlantı (URL):", "https://");
        if (url) executeFormatCommand("createLink", url);
      };

      const handleSaveIosNote = () => {
        let bodyContent = newIosNoteBody;
        if (editorAreaRef.current) {
          bodyContent = editorAreaRef.current.innerHTML;
        }

        let plainText = editorAreaRef.current ? editorAreaRef.current.innerText : newIosNoteBody;
        if (plainText === "Notunuzu buraya yazın...") plainText = "";

        if (!newIosNoteTitle.trim() && !plainText.trim()) {
          setIsEditingNote(false);
          return;
        }

        const now = new Date();
        const isoString = now.toISOString();

        const noteObj = {
          id: selectedNote ? selectedNote.id : "note_" + Date.now(),
          title: newIosNoteTitle || "Yeni Not",
          subtitle: plainText ? plainText.slice(0, 45) : "Ek içerik yok",
          body: bodyContent,
          image: noteImage,
          updatedAt: isoString,
          createdAt: selectedNote ? selectedNote.createdAt : isoString
        };

        saveNoteToFirebase(noteObj);
        setIsEditingNote(false);
        setSelectedNote(null);
        setNewIosNoteTitle("");
        setNewIosNoteBody("");
        setNoteImage(null);
      };

      const handleShareNote = () => {
        const plainText = editorAreaRef.current ? editorAreaRef.current.innerText : newIosNoteBody;
        const textToShare = `${newIosNoteTitle}\n\n${plainText}`;
        if (navigator.share) {
          navigator.share({
            title: newIosNoteTitle || "Not",
            text: textToShare
          }).catch(() => {});
        } else {
          navigator.clipboard.writeText(textToShare);
          alert("Not metni panoya kopyalandı!");
        }
      };

      // HASSAS CANVAS KORDİNAT HESAPLAMALARI DÜZELTİLDİ
      const getCanvasCoordinates = (evt) => {
        const canvas = canvasRef.current;
        if (!canvas) return { x: 0, y: 0 };
        const rect = canvas.getBoundingClientRect();
        const clientX = evt.clientX || (evt.touches && evt.touches[0] ? evt.touches[0].clientX : 0);
        const clientY = evt.clientY || (evt.touches && evt.touches[0] ? evt.touches[0].clientY : 0);

        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY
        };
      };

      const startDrawingOnCanvas = (evt) => {
        if (evt.type === 'touchstart') evt.preventDefault();
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const { x, y } = getCanvasCoordinates(evt);

        ctx.beginPath();
        ctx.moveTo(x, y);
        setIsDrawing(true);
      };

      const drawOnCanvas = (evt) => {
        if (!isDrawing) return;
        if (evt.type === 'touchmove') evt.preventDefault();
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const { x, y } = getCanvasCoordinates(evt);

        ctx.strokeStyle = canvasColor;
        ctx.lineWidth = canvasLineWidth;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.lineTo(x, y);
        ctx.stroke();
      };

      const stopDrawingOnCanvas = (evt) => {
        if (evt && evt.type === 'touchend') evt.preventDefault();
        setIsDrawing(false);
      };

      // DÜZELTME: Çizimi Doğrudan Not Sayfasına Ekler ve Sayfadan Çıkmaz
      const saveCanvasDrawingToNote = (e) => {
        if(e) e.preventDefault();
        const canvas = canvasRef.current;
        if (canvas) {
          const drawnBase64 = canvas.toDataURL("image/png");
          setNoteImage(drawnBase64);
          setShowCanvasModal(false);
        }
      };

      const addTask = (customTitle = null) => {
        const titleToUse = typeof customTitle === "string" ? customTitle : newTaskTitle;
        if (!titleToUse.trim() && !selectedTaskImage && !taskAudioBlob) return;
        
        const now = new Date();
        const formattedCreatedDate = `${now.toLocaleDateString('tr-TR')} ${now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })}`;

        const newTask = {
          id: Date.now().toString(),
          title: titleToUse || "Sesli Görev / Görsel",
          date: selectedDate,
          createdDate: formattedCreatedDate,
          completed: false,
          priority: newTaskPriority || "Yüksek",
          category: newTaskCategory || "Üretim",
          bgColor: newTaskBgColor || "#ffffff",
          alarmTime: newTaskAlarm || "",
          alarmType: newTaskAlarmType || "both",
          alarmNotified: false,
          image: selectedTaskImage,
          audio: taskAudioBlob,
          createdBy: profile.fullName,
          assignedTo: profile.fullName,
          isRollover: false
        };

        saveTaskToFirebase(newTask);
        setNewTaskTitle("");
        setNewTaskBgColor("#ffffff");
        setNewTaskAlarm("");
        setSelectedTaskImage(null);
        setTaskAudioBlob(null);
        setShowAddForm(false);
      };

      const toggleTask = (id) => {
        const existing = tasks.find(t => t.id === id);
        if (existing) saveTaskToFirebase({ ...existing, completed: !existing.completed });
      };

      const addMeetingFolder = () => {
        if (!newMeetingTitle.trim()) return;
        const newFolder = {
          id: "folder_" + Date.now(),
          title: newMeetingTitle,
          createdBy: profile.fullName,
          sessions: []
        };
        saveTopicToFirebase(newFolder);
        setNewMeetingTitle("");
      };

      const addSessionToFolder = (folderId) => {
        const folder = meetingTopics.find(f => f.id === folderId);
        if (!folder) return;

        const currentSessions = folder.sessions || [];
        const sessionNum = currentSessions.length + 1;

        const newSession = {
          id: "sess_" + Date.now(),
          title: `${sessionNum}. Toplantı`,
          date: newSessionDate,
          notes: []
        };

        saveTopicToFirebase({
          ...folder,
          sessions: [newSession, ...currentSessions]
        });
      };

      const addNoteToSession = async (folderId, sessionId) => {
        if (!newNoteContent.trim() && !selectedMeetingImage && !meetingAudioBlob) return;
        
        const folder = meetingTopics.find(f => f.id === folderId);
        if (!folder) return;

        const now = new Date();
        const formattedDate = `${now.toLocaleDateString('tr-TR')} ${now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })}`;

                  ref: editorAreaRef,
                  contentEditable: true,
                  suppressContentEditableWarning: true,
                  onFocus: (ev) => {
                    if (ev.target.innerText.trim() === "Notunuzu buraya yazın...") {
                      ev.target.innerText = "";
                    }
                  },
                  onBlur: (ev) => {
                    if (ev.target.innerText.trim() === "") {
                      ev.target.innerText = "Notunuzu buraya yazın...";
                    }
                  },
                  dangerouslySetInnerHTML: { __html: newIosNoteBody || "Notunuzu buraya yazın..." },
                  className: "w-full min-h-[220px] bg-transparent text-sm font-medium text-slate-700 dark:text-slate-200 outline-none resize-none leading-relaxed overflow-y-auto"
                }),

                noteImage && e("div", { className: "relative w-36 h-28 my-2" },
                  e("img", { src: noteImage, className: "w-full h-full object-cover rounded-xl border border-slate-300 dark:border-slate-700 shadow-md" }),
                  e("button", { onClick: () => setNoteImage(null), className: "absolute -top-2 -right-2 bg-rose-500 text-white w-6 h-6 rounded-full text-xs font-bold flex items-center justify-center shadow" }, "✕")
                )
              ),

              e("div", { className: "border-t pt-2 dark:border-slate-800 space-y-2" },
                activeToolbarMenu === "textStyle" && e("div", { className: "bg-slate-100 dark:bg-slate-800 p-2 rounded-2xl flex items-center justify-between text-xs font-bold gap-1 border border-slate-200 dark:border-slate-700 animate-fadeIn" },
                  ["Başlık", "Alt Başlık", "Gövde", "Monospaced"].map(style => e("button", {
                    key: style,
                    onClick: () => {
                      setActiveTextStyle(style);
                      if (style === "Başlık") executeFormatCommand("formatBlock", "<h1>");
                      else if (style === "Alt Başlık") executeFormatCommand("formatBlock", "<h2>");
                      else executeFormatCommand("formatBlock", "<p>");
                      setActiveToolbarMenu(null);
                    },
                    className: `px-2.5 py-1 rounded-xl transition-all ${activeTextStyle === style ? "bg-amber-500 text-black shadow" : "hover:bg-slate-200 dark:hover:bg-slate-700"}`
                  }, style))
                ),

                activeToolbarMenu === "alignment" && e("div", { className: "bg-slate-100 dark:bg-slate-800 p-2 rounded-2xl flex items-center justify-around text-xs font-bold border border-slate-200 dark:border-slate-700 animate-fadeIn" },
                  e("button", { onClick: () => { executeFormatCommand("justifyLeft"); setActiveToolbarMenu(null); } }, "⇤ Sola"),
                  e("button", { onClick: () => { executeFormatCommand("justifyCenter"); setActiveToolbarMenu(null); } }, "↔️ Ortala"),
                  e("button", { onClick: () => { executeFormatCommand("justifyRight"); setActiveToolbarMenu(null); } }, "⇥ Sağa"),
                  e("button", { onClick: () => { executeFormatCommand("indent"); setActiveToolbarMenu(null); } }, "➡️ Girinti Artır"),
                  e("button", { onClick: () => { executeFormatCommand("outdent"); setActiveToolbarMenu(null); } }, "⬅️ Girinti Azalt")
                ),

                e("div", { className: "bg-slate-100 dark:bg-slate-800 px-3 py-2 rounded-2xl flex items-center justify-between border border-slate-200 dark:border-slate-700 shadow-sm" },
                  
                  e("button", {
                    onClick: () => setActiveToolbarMenu(activeToolbarMenu === "textStyle" ? null : "textStyle"),
                    className: "text-slate-700 dark:text-slate-200 font-black text-sm hover:text-amber-500"
                  }, "Aa"),

                  e("button", {
                    onClick: () => executeFormatCommand("bold"),
                    className: "text-slate-700 dark:text-slate-200 font-black text-sm hover:text-amber-500"
                  }, "B"),

                  e("button", {
                    onClick: () => executeFormatCommand("italic"),
                    className: "text-slate-700 dark:text-slate-200 italic font-bold text-sm hover:text-amber-500"
                  }, "I"),

                  e("button", {
                    onClick: () => executeFormatCommand("underline"),
                    className: "text-slate-700 dark:text-slate-200 underline font-bold text-sm hover:text-amber-500"
                  }, "U"),

                  e("button", {
                    onClick: () => executeFormatCommand("strikeThrough"),
                    className: "text-slate-700 dark:text-slate-200 line-through font-bold text-sm hover:text-amber-500"
                  }, "S"),

                  e("button", {
                    onClick: () => executeFormatCommand("backColor", "#fef08a"),
                    className: "text-slate-700 dark:text-slate-200 hover:text-amber-500 text-sm"
                  }, "✏️"),

                  e("button", {
                    onClick: () => setActiveToolbarMenu(activeToolbarMenu === "alignment" ? null : "alignment"),
                    className: "text-slate-700 dark:text-slate-200 hover:text-amber-500 text-sm"
                  }, "≡"),

                  e("button", {
                    onClick: () => executeFormatCommand("insertUnorderedList"),
                    className: "text-slate-700 dark:text-slate-200 hover:text-amber-500 text-sm font-bold"
                  }, "☑️"),

                  e("button", {
                    onClick: insertTableIntoNote,
                    className: "text-slate-700 dark:text-slate-200 hover:text-amber-500 text-sm"
                  }, "▦"),

                  e("button", {
                    onClick: addLinkToNote,
                    className: "text-slate-700 dark:text-slate-200 hover:text-amber-500 text-sm"
                  }, "🔗"),

                  e("button", {
                    onClick: () => noteFileInputRef.current && noteFileInputRef.current.click(),
                    className: "text-slate-700 dark:text-slate-200 hover:text-amber-500 text-sm"
                  }, "📎"),

                  e("button", {
                    onClick: () => setShowCanvasModal(true),
                    className: "text-slate-700 dark:text-slate-200 hover:text-amber-500 text-sm"
                  }, "✍️")
                ),

                e("button", {
                  onClick: handleSaveIosNote,
                  className: "w-full py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-2xl font-black text-sm flex items-center justify-center shadow-lg active:scale-95"
                }, "✓ Kaydet ve Kapat")
              )
            ) :

            e("div", { className: "space-y-3" },
              
              e("div", { className: "flex items-center justify-between px-1" },
                e("button", {
                  onClick: () => setActiveTab("daily"),
                  className: "w-9 h-9 rounded-full bg-slate-200/80 dark:bg-slate-800 flex items-center justify-center text-amber-600 dark:text-amber-400 font-bold text-2xl active:scale-95 transition-transform"
                }, "‹"),

                e("button", {
                  onClick: () => setShowNoteOptionsMenu(!showNoteOptionsMenu),
                  className: "w-9 h-9 rounded-full bg-slate-200/80 dark:bg-slate-800 flex items-center justify-center text-amber-600 dark:text-amber-400 font-bold text-sm active:scale-95 transition-transform"
                }, "•••")
              ),

              showNoteOptionsMenu && e("div", { className: "p-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-xl space-y-1 text-xs" },
                e("button", {
                  onClick: () => {
                    setNotes(prev => [...prev].sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt)));
                    setShowNoteOptionsMenu(false);
                  },
                  className: "w-full text-left p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl font-bold"
                }, "📅 Tarihe Göre Sırala"),
                e("button", {
                  onClick: () => {
                    if (confirm("Tüm notlar silinsin mi?")) {
                      notes.forEach(n => deleteNoteFromFirebase(n.id));
                    }
                    setShowNoteOptionsMenu(false);
                  },
                  className: "w-full text-left p-2 text-rose-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl font-bold"
                }, "🗑️ Tüm Notları Sil")
              ),

              e("div", { className: "px-1" },
                e("h2", { className: "text-3xl font-black text-slate-900 dark:text-white" }, "Notlar"),
                e("span", { className: "text-xs font-bold text-slate-400 block mt-0.5" }, `${notes.length} Not`)
              ),

              Object.keys(getGroupedNotes()).length === 0 ? e("div", { className: "text-center py-10 text-slate-400 font-bold text-xs" }, "Kayıtlı not bulunamadı.") :
              Object.entries(getGroupedNotes()).map(([groupTitle, groupNotes]) => {
                if (!groupNotes || groupNotes.length === 0) return null;
                return e("div", { key: groupTitle, className: "space-y-1.5" },
                  e("h3", { className: "text-xs font-black text-slate-700 dark:text-slate-300 px-1" }, groupTitle),
                  
                  e("div", { className: "bg-white/95 dark:bg-slate-900/95 backdrop-blur-xs rounded-2xl border border-slate-200 dark:border-slate-800 divide-y divide-slate-100 dark:divide-slate-800/80 overflow-hidden shadow-xs" },
                    groupNotes.map(note => e("div", {
                      key: note.id,
                      onClick: () => {
                        setSelectedNote(note);
                        setNewIosNoteTitle(note.title);
                        setNewIosNoteBody(note.body || "");
                        setNoteImage(note.image || null);
                        setIsEditingNote(true);
                      },
                      className: "p-3 flex items-center justify-between gap-3 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors"
                    },
                      e("div", { className: "flex-1 min-w-0 space-y-0.5" },
                        e("h4", { className: "font-black text-xs text-slate-900 dark:text-white truncate" }, note.title || "Başlıksız Not"),
                        e("div", { className: "flex items-center gap-2" },
                          e("span", { className: "text-[10px] text-slate-400 font-semibold shrink-0" }, new Date(note.updatedAt || Date.now()).toLocaleDateString('tr-TR')),
                          e("span", { className: "text-[10px] text-slate-500 dark:text-slate-400 font-normal truncate" }, note.subtitle || note.body?.replace(/<[^>]*>?/gm, '') || "Ek detay yok")
                        )
                      ),

                      note.image ? e("img", { src: note.image, className: "w-10 h-10 object-cover rounded-lg border border-slate-200 dark:border-slate-700 shrink-0" }) :
                      e("button", {
                        onClick: (ev) => {
                          ev.stopPropagation();
                          deleteNoteFromFirebase(note.id);
                        },
                        className: "text-slate-400 hover:text-rose-500 text-xs px-1"
                      }, "🗑️")
                    ))
                  )
                );
              }),

              e("div", { className: "fixed bottom-16 left-0 right-0 max-w-md mx-auto px-4 z-30" },
                e("div", { className: "bg-slate-900/90 backdrop-blur-md p-1.5 rounded-full border border-slate-800 flex items-center gap-2 shadow-2xl" },
                  e("div", { className: "flex-1 flex items-center bg-slate-800/90 rounded-full px-3 py-1.5 gap-2 border border-slate-700/50" },
                    e("span", { className: "text-slate-400 text-xs" }, "🔍"),
                    e("input", {
                      type: "text",
                      placeholder: "Arayın",
                      value: noteSearchQuery,
                      onChange: (ev) => setNoteSearchQuery(ev.target.value),
                      className: "w-full bg-transparent text-xs text-white outline-none placeholder-slate-400 font-medium"
                    }),
                    e("button", {
                      onClick: () => startLiveListening("iosNote"),
                      className: "text-slate-400 hover:text-amber-400 text-xs"
                    }, "🎙️")
                  ),

                  e("button", {
                    onClick: () => {
                      setSelectedNote(null);
                      setNewIosNoteTitle("");
                      setNewIosNoteBody("");
                      setNoteImage(null);
                      setIsEditingNote(true);
                    },
                    className: "w-9 h-9 bg-slate-800 hover:bg-slate-700 text-amber-500 rounded-full flex items-center justify-center font-bold border border-slate-700 text-sm shrink-0 shadow-lg active:scale-95"
                  }, "✍️")
                )
              )
            )
          ),

          /* 4. PROFİL */
          activeTab === "profile" && e("div", { className: "space-y-4 animate-fadeIn" },
            
            e("div", { className: "p-4 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xs rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm flex items-center gap-4" },
              e("div", { className: "relative group" },
                e("div", { className: "w-16 h-16 rounded-full overflow-hidden border-2 border-blue-600 bg-slate-100 dark:bg-slate-800 flex items-center justify-center font-black text-xl text-slate-400 shadow-inner" },
                  profile.avatar ? e("img", { src: profile.avatar, className: "w-full h-full object-cover" }) : profile.fullName.charAt(0)
                ),
                e("button", {
                  onClick: () => avatarFileInputRef.current && avatarFileInputRef.current.click(),
                  className: "absolute bottom-0 right-0 bg-blue-600 text-white p-1 rounded-full text-[10px] shadow-lg"
                }, "📷")
              ),
              e("div", { className: "flex-1 space-y-0.5" },
                e("h3", { className: "font-black text-sm text-slate-900 dark:text-white" }, profile.fullName),
                e("p", { className: "text-[11px] text-slate-500 font-medium" }, profile.email),
                e("p", { className: "text-[11px] text-slate-400 font-medium" }, profile.phone)
              )
            ),

            e("div", { className: "p-4 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xs rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-3" },
              e("h4", { className: "font-black text-xs text-slate-800 dark:text-slate-200 flex items-center gap-1.5" }, "👤 Profil & Kişisel Bilgiler"),
              
              e("div", { className: "space-y-2" },
                e("div", null,
                  e("label", { className: "text-[10px] font-bold text-slate-400 block mb-0.5" }, "Ad Soyad"),
                  e("input", {
                    type: "text",
                    value: profile.fullName,
                    onChange: (ev) => saveProfile({ ...profile, fullName: ev.target.value }),
                    className: "w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl text-xs font-semibold outline-none"
                  })
                ),
                e("div", null,
                  e("label", { className: "text-[10px] font-bold text-slate-400 block mb-0.5" }, "E-posta Adresi"),
                  e("input", {
                    type: "email",
                    value: profile.email,
                    onChange: (ev) => saveProfile({ ...profile, email: ev.target.value }),
                    className: "w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl text-xs font-semibold outline-none"
                  })
                ),
                e("div", null,
                  e("label", { className: "text-[10px] font-bold text-slate-400 block mb-0.5" }, "Telefon Numarası"),
                  e("input", {
                    type: "text",
                    value: profile.phone,
                    onChange: (ev) => saveProfile({ ...profile, phone: ev.target.value }),
                    className: "w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl text-xs font-semibold outline-none"
                  })
                )
              )
            ),

            e("div", { className: "p-4 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xs rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm flex items-center justify-between" },
              e("div", null,
                e("h4", { className: "font-black text-xs text-slate-800 dark:text-slate-200" }, "🎨 Görünüm & Tema Stilleri"),
                e("p", { className: "text-[10px] text-slate-400 font-medium" }, "Renk Paleti, Stil Kataloğu & Özel Duvar Kağıdı")
              ),
              e("button", {
                onClick: () => setShowThemeModal(true),
                className: "px-3.5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-black shadow-md flex items-center gap-1.5"
              }, "Temaları Aç ➔")
            ),

            e("div", { className: "p-4 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xs rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm flex items-center justify-between" },
              e("div", null,
                e("h4", { className: "font-black text-xs text-slate-800 dark:text-slate-200" }, "🔒 Güvenlik & Oturum"),
                e("p", { className: "text-[10px] text-slate-400 font-medium" }, "PIN Kilidi ve Oturum Yönetimi")
              ),
              e("button", {
                onClick: handleLogout,
                className: "px-3 py-1.5 bg-rose-50 dark:bg-rose-950 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-900 rounded-xl text-xs font-bold"
              }, "Çıkış Yap")
            )
          )
        ),

        /* ALT NAVİGASYON BAR */
        e("nav", { className: "fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border-t border-slate-200 dark:border-slate-800 flex items-center justify-around py-2 z-40 shadow-2xl" },
          
          e("button", {
            onClick: () => setActiveTab("daily"),
            className: `flex flex-col items-center gap-0.5 transition-all ${activeTab === "daily" ? "text-blue-600 dark:text-blue-400 scale-105 font-black" : "text-slate-400 font-medium"}`
          },
            e("span", { className: "text-lg" }, "☑️"),
            e("span", { className: "text-[10px]" }, "Görevler")
          ),

          e("button", {
            onClick: () => setActiveTab("meetings"),
            className: `flex flex-col items-center gap-0.5 transition-all ${activeTab === "meetings" ? "text-blue-600 dark:text-blue-400 scale-105 font-black" : "text-slate-400 font-medium"}`
          },
            e("span", { className: "text-lg" }, "📁"),
            e("span", { className: "text-[10px]" }, "Toplantılar")
          ),

          e("button", {
            onClick: () => setActiveTab("notes"),
            className: `flex flex-col items-center gap-0.5 transition-all ${activeTab === "notes" ? "text-amber-500 scale-105 font-black" : "text-slate-400 font-medium"}`
          },
            e("span", { className: "text-lg" }, "📝"),
            e("span", { className: "text-[10px]" }, "Notlarım")
          ),

          e("button", {
            onClick: () => setActiveTab("profile"),
            className: `flex flex-col items-center gap-0.5 transition-all ${activeTab === "profile" ? "text-blue-600 dark:text-blue-400 scale-105 font-black" : "text-slate-400 font-medium"}`
          },
            profile.avatar ? e("img", { 
              src: profile.avatar, 
              className: `w-6 h-6 rounded-full object-cover border ${activeTab === "profile" ? "border-blue-600 ring-2 ring-blue-600/30" : "border-slate-400"}` 
            }) : e("div", { 
              className: `w-6 h-6 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center text-[10px] font-bold ${activeTab === "profile" ? "bg-blue-600 text-white" : ""}` 
            }, profile.fullName.charAt(0)),
            e("span", { className: "text-[10px]" }, "Siz")
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(e(App));
  </script>
</body>
</html>
