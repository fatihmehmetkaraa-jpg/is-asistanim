<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İş Asistanım PRO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script>
    tailwind.config = { darkMode: 'class' }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      onSnapshot, 
      doc, 
      setDoc, 
      deleteDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAElv1iaPxHPiWqDXkSOsZBw86S4WCPov4",
      authDomain: "is-asistanim.firebaseapp.com",
      projectId: "is-asistanim",
      storageBucket: "is-asistanim.firebasestorage.app",
      messagingSenderId: "385268930352",
      appId: "1:385268930352:web:78f65dc5e09622a657daf5",
      measurementId: "G-X1VVE26CE9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.dbFuncs = { collection, onSnapshot, doc, setDoc, deleteDoc };
  </script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script>
    const e = React.createElement;
    const { useState, useEffect, useRef } = React;

    // Resim Sıkıştırma
    const compressImage = (file, maxWidth = 800, quality = 0.7, callback) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
          callback(compressedDataUrl);
        };
      };
    };

    function App() {
      const todayISO = new Date().toISOString().split("T")[0];

      // Güvenlik & Oturum
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        return localStorage.getItem("app_authenticated") === "true";
      });
      const [userPin, setUserPin] = useState(() => localStorage.getItem("app_pin") || "");
      const [inputPin, setInputPin] = useState("");
      const [inputCred, setInputCred] = useState("");

      // Tema ve Arka Plan
      const [darkMode, setDarkMode] = useState(false);
      const [bgPattern, setBgPattern] = useState(() => localStorage.getItem("app_bg") || "default");
      const [customBgUrl, setCustomBgUrl] = useState(() => localStorage.getItem("app_bg_custom") || "");
      const [showSettings, setShowSettings] = useState(false);

      // Navigasyon
      const [activeTab, setActiveTab] = useState("daily");
      const [selectedDate, setSelectedDate] = useState(todayISO);
      const [selectedFolderId, setSelectedFolderId] = useState(null);
      const [selectedSessionId, setSelectedSessionId] = useState(null);

      // Modallar
      const [previewImageUrl, setPreviewImageUrl] = useState(null);
      const [editingItem, setEditingItem] = useState(null); // { type: 'task' | 'note', data: ... }

      // Medya ve Refler
      const taskFileInputRef = useRef(null);
      const meetingFileInputRef = useRef(null);
      const bgFileInputRef = useRef(null);

      const [selectedTaskImage, setSelectedTaskImage] = useState(null);
      const [selectedMeetingImage, setSelectedMeetingImage] = useState(null);

      const [taskAudioBlob, setTaskAudioBlob] = useState(null);
      const [meetingAudioBlob, setMeetingAudioBlob] = useState(null);

      // Sesli Mod Kontrolleri
      const [speechTarget, setSpeechTarget] = useState(null); // 'task' | 'note'
      const [showAudioMenu, setShowAudioMenu] = useState(null); // 'task' | 'note'
      const [isLiveListening, setIsLiveListening] = useState(false);
      const [liveTranscript, setLiveTranscript] = useState("");
      const [isRecordingAudio, setIsRecordingAudio] = useState(false);

      const recognitionRef = useRef(null);
      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);

      // Veriler
      const [tasks, setTasks] = useState([]);
      const [meetingTopics, setMeetingTopics] = useState([]);

      // Formlar
      const [showAddForm, setShowAddForm] = useState(false);
      const [newTaskTitle, setNewTaskTitle] = useState("");
      const [newTaskPriority, setNewTaskPriority] = useState("Yüksek");
      const [newTaskCategory, setNewTaskCategory] = useState("Üretim");

      const [newMeetingTitle, setNewMeetingTitle] = useState("");
      const [newSessionDate, setNewSessionDate] = useState(todayISO);
      const [newNoteContent, setNewNoteContent] = useState("");
      const [newNoteAssignee, setNewNoteAssignee] = useState("");

      const [isSyncing, setIsSyncing] = useState(true);

      // Tarih Listesi
      const generateDateList = () => {
        const dates = [];
        const base = new Date();
        for (let i = -3; i <= 7; i++) {
          const d = new Date(base);
          d.setDate(base.getDate() + i);
          const iso = d.toISOString().split("T")[0];
          const dayName = d.toLocaleDateString("tr-TR", { weekday: "short" });
          const dayNum = d.getDate();
          dates.push({ iso, dayName, dayNum });
        }
        return dates;
      };

      const dateList = generateDateList();

      useEffect(() => {
        if (darkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [darkMode]);

      // Firebase Senkronizasyonu
      useEffect(() => {
        const checkDb = setInterval(() => {
          if (window.db && window.dbFuncs) {
            clearInterval(checkDb);
            const { collection, onSnapshot } = window.dbFuncs;

            const unsubTasks = onSnapshot(collection(window.db, "tasks"), (snapshot) => {
              const loadedTasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              
              const updatedTasks = loadedTasks.map(task => {
                if (!task.completed && task.date < todayISO) {
                  const rolledTask = { ...task, date: todayISO, isRollover: true };
                  saveTaskToFirebase(rolledTask);
                  return rolledTask;
                }
                return task;
              });

              setTasks(updatedTasks);
              setIsSyncing(false);
            });

            const unsubTopics = onSnapshot(collection(window.db, "topics"), (snapshot) => {
              const loadedTopics = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setMeetingTopics(loadedTopics);
            });

            return () => { unsubTasks(); unsubTopics(); };
          }
        }, 300);
        return () => clearInterval(checkDb);
      }, []);

      // Güvenlik Doğrulama
      const handleAuthSubmit = () => {
        const storedPin = localStorage.getItem("app_pin");
        if (!storedPin) {
          if (!inputPin.trim()) return alert("Lütfen bir PIN/Şifre belirleyin.");
          localStorage.setItem("app_pin", inputPin);
          localStorage.setItem("app_cred", inputCred);
          localStorage.setItem("app_authenticated", "true");
          setIsAuthenticated(true);
        } else {
          if (inputPin === storedPin) {
            localStorage.setItem("app_authenticated", "true");
            setIsAuthenticated(true);
          } else {
            alert("Hatalı Şifre/PIN!");
          }
        }
      };

      const handleLogout = () => {
        localStorage.removeItem("app_authenticated");
        setIsAuthenticated(false);
      };

      // Tema Değişimi
      const handleBgChange = (type) => {
        setBgPattern(type);
        localStorage.setItem("app_bg", type);
      };

      // CANLI SES TANIMA (Transkript)
      const startLiveListening = (target) => {
        if (!("webkitSpeechRecognition" in window) && !("SpeechRecognition" in window)) {
          return alert("Tarayıcınız ses tanıma özelliğini desteklemiyor.");
        }

        stopAllAudioControls();
        setSpeechTarget(target);
        setIsLiveListening(true);
        setLiveTranscript("");

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = "tr-TR";
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onresult = (event) => {
          let currentText = "";
          for (let i = event.resultIndex; i < event.results.length; ++i) {
            currentText += event.results[i][0].transcript;
          }
          setLiveTranscript(currentText);

          if (target === "task") {
            setNewTaskTitle(currentText);
            setShowAddForm(true);
          } else if (target === "note") {
            setNewNoteContent(currentText);
          }
        };

        recognition.onerror = () => stopAllAudioControls();
        recognition.onend = () => setIsLiveListening(false);

        recognitionRef.current = recognition;
        recognition.start();
      };

      // SES KAYDI (Audio File)
      const startAudioRecording = (target) => {
        stopAllAudioControls();
        setSpeechTarget(target);

        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
          const mediaRecorder = new MediaRecorder(stream);
          mediaRecorderRef.current = mediaRecorder;
          audioChunksRef.current = [];

          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunksRef.current.push(e.data);
          };

          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = () => {
              const base64Audio = reader.result;
              if (target === "task") {
                setTaskAudioBlob(base64Audio);
                setShowAddForm(true);
              } else if (target === "note") {
                setMeetingAudioBlob(base64Audio);
              }
            };
            stream.getTracks().forEach(track => track.stop());
          };

          mediaRecorder.start();
          setIsRecordingAudio(true);
        }).catch(err => alert("Mikrofon izni alınamadı: " + err));
      };

      // Mikrofonu Tam Kapatma Fonksiyonu
      const stopAllAudioControls = () => {
        if (recognitionRef.current) {
          recognitionRef.current.stop();
          recognitionRef.current = null;
        }
        if (mediaRecorderRef.current && isRecordingAudio) {
          mediaRecorderRef.current.stop();
          mediaRecorderRef.current = null;
        }
        setIsLiveListening(false);
        setIsRecordingAudio(false);
        setShowAudioMenu(null);
      };

      // Firebase İşlemleri
      const saveTaskToFirebase = async (taskObj) => {
        if (!window.db) return;
        const { doc, setDoc } = window.dbFuncs;
        await setDoc(doc(window.db, "tasks", taskObj.id), taskObj);
      };

      const deleteTaskFromFirebase = async (id) => {
        if (!window.db) return;
        const { doc, deleteDoc } = window.dbFuncs;
        await deleteDoc(doc(window.db, "tasks", id));
      };

      const saveTopicToFirebase = async (topicObj) => {
        if (!window.db) return;
        const { doc, setDoc } = window.dbFuncs;
        await setDoc(doc(window.db, "topics", topicObj.id), topicObj);
      };

      const addTask = () => {
        if (!newTaskTitle.trim() && !selectedTaskImage && !taskAudioBlob) return;
        const newTask = {
          id: Date.now().toString(),
          title: newTaskTitle || "Sesli Görev / Görsel",
          date: selectedDate,
          completed: false,
          priority: newTaskPriority || "Yüksek",
          category: newTaskCategory || "Üretim",
          image: selectedTaskImage,
          audio: taskAudioBlob,
          isRollover: false
        };
        saveTaskToFirebase(newTask);
        setNewTaskTitle("");
        setSelectedTaskImage(null);
        setTaskAudioBlob(null);
        setShowAddForm(false);
      };

      const toggleTask = (id) => {
        const existing = tasks.find(t => t.id === id);
        if (existing) saveTaskToFirebase({ ...existing, completed: !existing.completed });
      };

      const addMeetingFolder = () => {
        if (!newMeetingTitle.trim()) return;
        const newFolder = {
          id: "folder_" + Date.now(),
          title: newMeetingTitle,
          sessions: []
        };
        saveTopicToFirebase(newFolder);
        setNewMeetingTitle("");
      };

      const addSessionToFolder = (folderId) => {
        const folder = meetingTopics.find(f => f.id === folderId);
        if (!folder) return;

        const currentSessions = folder.sessions || [];
        const sessionNum = currentSessions.length + 1;

        const newSession = {
          id: "sess_" + Date.now(),
          title: `${sessionNum}. Toplantı`,
          date: newSessionDate,
          notes: []
        };

        saveTopicToFirebase({
          ...folder,
          sessions: [newSession, ...currentSessions]
        });
      };

      const addNoteToSession = (folderId, sessionId) => {
        if (!newNoteContent.trim() && !selectedMeetingImage && !meetingAudioBlob) return;
        const folder = meetingTopics.find(f => f.id === folderId);
        if (!folder) return;

        const updatedSessions = (folder.sessions || []).map(sess => {
          if (sess.id === sessionId) {
            return {
              ...sess,
              notes: [{
                id: "n_" + Date.now(),
                content: newNoteContent || "Ses Kaydı / Not",
                assignee: newNoteAssignee || "Atanmadı",
                image: selectedMeetingImage,
                audio: meetingAudioBlob,
                date: todayISO
              }, ...(sess.notes || [])]
            };
          }
          return sess;
        });

        saveTopicToFirebase({ ...folder, sessions: updatedSessions });
        setNewNoteContent("");
        setNewNoteAssignee("");
        setSelectedMeetingImage(null);
        setMeetingAudioBlob(null);
      };

      // Düzenlenen Ögeyi Kaydetme
      const saveEditedItem = () => {
        if (!editingItem) return;
        if (editingItem.type === "task") {
          saveTaskToFirebase(editingItem.data);
        } else if (editingItem.type === "note") {
          const folder = meetingTopics.find(f => f.id === selectedFolderId);
          if (folder) {
            const updatedSessions = (folder.sessions || []).map(sess => {
              if (sess.id === selectedSessionId) {
                return {
                  ...sess,
                  notes: (sess.notes || []).map(n => n.id === editingItem.data.id ? editingItem.data : n)
                };
              }
              return sess;
            });
            saveTopicToFirebase({ ...folder, sessions: updatedSessions });
          }
        }
        setEditingItem(null);
      };

      const exportSessionPDF = (folderTitle, session) => {
        const element = document.createElement("div");
        element.style.padding = "20px";
        element.style.fontFamily = "Arial, sans-serif";

        let notesHtml = (session.notes || []).map((n, idx) => `
          <tr style="border-bottom: 1px solid #ddd;">
            <td style="padding: 8px; font-weight: bold; width: 30px;">${idx + 1}.</td>
            <td style="padding: 8px;">${n.content}</td>
            <td style="padding: 8px; font-weight: bold; color: #2563eb;">${n.assignee}</td>
            <td style="padding: 8px; color: #666; font-size: 10px;">${n.date}</td>
          </tr>
        `).join("");

        element.innerHTML = `
          <div style="border-bottom: 2px solid #1e3a8a; padding-bottom: 10px; margin-bottom: 15px;">
            <h2 style="color: #1e3a8a; margin: 0; font-size: 16px;">TOPLANTI TUTANAĞI</h2>
            <p style="margin: 4px 0 0 0; color: #333; font-size: 12px;"><strong>Konu:</strong> ${folderTitle}</p>
            <p style="margin: 2px 0 0 0; color: #333; font-size: 12px;"><strong>Oturum:</strong> ${session.title} (${session.date})</p>
          </div>
          
          <table style="width: 100%; border-collapse: collapse; font-size: 11px; text-align: left;">
            <thead>
              <tr style="background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1;">
                <th style="padding: 6px;">#</th>
                <th style="padding: 6px;">Karar / Not</th>
                <th style="padding: 6px;">Sorumlu</th>
                <th style="padding: 6px;">Tarih</th>
              </tr>
            </thead>
            <tbody>
              ${notesHtml || '<tr><td colspan="4" style="padding:8px;">Kayıtlı karar yok.</td></tr>'}
            </tbody>
          </table>
        `;

        const opt = {
          margin: 0.5,
          filename: `${folderTitle}_${session.title}_Tutanak.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2 },
          jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save();
      };

      const activeFolderObj = meetingTopics.find(f => f.id === selectedFolderId);
      const activeSessionObj = activeFolderObj?.sessions?.find(s => s.id === selectedSessionId);
      const filteredTasks = tasks.filter(t => t.date === selectedDate);

      const getPriorityBadgeClass = (priority) => {
        switch (priority) {
          case "Yüksek": return "bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300 border-rose-200 dark:border-rose-800";
          case "Orta": return "bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300 border-amber-200 dark:border-amber-800";
          case "Düşük": return "bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800";
          default: return "bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300 border-slate-200 dark:border-slate-700";
        }
      };

      // Arka Plan Stil Oluşturma
      const getBgStyle = () => {
        if (bgPattern === "custom" && customBgUrl) {
          return { backgroundImage: `url(${customBgUrl})`, backgroundSize: 'cover', backgroundPosition: 'center' };
        }
        if (bgPattern === "dots") {
          return { backgroundImage: 'radial-gradient(circle, #cbd5e1 1px, transparent 1px)', backgroundSize: '16px 16px' };
        }
        if (bgPattern === "grid") {
          return { backgroundImage: 'linear-gradient(to right, #e2e8f0 1px, transparent 1px), linear-gradient(to bottom, #e2e8f0 1px, transparent 1px)', backgroundSize: '20px 20px' };
        }
        return {};
      };

      /* ---------------- GİRİŞ / KİLİT EKRANI ---------------- */
      if (!isAuthenticated) {
        const isFirstSetup = !localStorage.getItem("app_pin");
        return e("div", { className: "min-h-screen flex items-center justify-center p-4 bg-slate-900 text-white" },
          e("div", { className: "w-full max-w-sm bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-2xl space-y-4 text-center" },
            e("div", { className: "w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto text-xl font-black shadow-lg" }, "🔒"),
            e("h2", { className: "text-lg font-black" }, isFirstSetup ? "Güvenlik Kurulumu" : "Giriş Yapın"),
            e("p", { className: "text-xs text-slate-400" }, isFirstSetup ? "Uygulama için bir e-posta/tel ve PIN belirleyin." : "Devam etmek için PIN kodunuzu girin."),
            
            isFirstSetup && e("input", {
              type: "text",
              placeholder: "E-posta veya Tel No",
              value: inputCred,
              onChange: (ev) => setInputCred(ev.target.value),
              className: "w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-center outline-none"
            }),

            e("input", {
              type: "password",
              placeholder: "4 Haneli PIN / Şifre",
              value: inputPin,
              onChange: (ev) => setInputPin(ev.target.value),
              className: "w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm font-bold text-center tracking-widest outline-none"
            }),

            e("button", {
              onClick: handleAuthSubmit,
              className: "w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-black text-xs transition-all shadow-lg"
            }, isFirstSetup ? "Kaydet ve Başla" : "Giriş Yap")
          )
        );
      }

      /* ---------------- ANA UYGULAMA ARAYÜZÜ ---------------- */
      return e("div", { 
        style: getBgStyle(),
        className: "max-w-md mx-auto min-h-screen flex flex-col pb-12 relative transition-all" 
      },
        
        // Modal: Görsel Önizleme
        previewImageUrl && e("div", {
          className: "fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm",
          onClick: () => setPreviewImageUrl(null)
        },
          e("div", { className: "relative max-w-full max-h-full flex flex-col items-center" },
            e("button", {
              onClick: () => setPreviewImageUrl(null),
              className: "absolute -top-10 right-0 text-white bg-slate-800/80 p-2 rounded-full text-xs font-bold w-8 h-8 flex items-center justify-center shadow-lg"
            }, "✕"),
            e("img", { src: previewImageUrl, className: "max-w-full max-h-[80vh] object-contain rounded-2xl shadow-2xl border border-white/20" })
          )
        ),

        // Modal: Düzenleme (Görev & Not)
        editingItem && e("div", {
          className: "fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-xs"
        },
          e("div", { className: "w-full bg-white dark:bg-slate-900 p-4 rounded-2xl space-y-3 shadow-2xl border border-slate-200 dark:border-slate-800" },
            e("h3", { className: "font-black text-xs text-slate-800 dark:text-white" }, "✏️ İçeriği Düzenle"),
            
            e("textarea", {
              rows: "3",
              value: editingItem.data.title || editingItem.data.content || "",
              onChange: (ev) => {
                const val = ev.target.value;
                setEditingItem(prev => ({
                  ...prev,
                  data: { ...prev.data, [prev.type === "task" ? "title" : "content"]: val }
                }));
              },
              className: "w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl text-xs outline-none font-medium"
            }),

            editingItem.type === "task" && e("div", { className: "flex gap-2" },
              e("select", {
                value: editingItem.data.priority,
                onChange: (ev) => setEditingItem(prev => ({ ...prev, data: { ...prev.data, priority: ev.target.value } })),
                className: "flex-1 p-1.5 bg-slate-50 dark:bg-slate-800 border rounded-xl text-xs font-bold outline-none"
              },
                e("option", { value: "Yüksek" }, "🔴 Yüksek"),
                e("option", { value: "Orta" }, "🟠 Orta"),
                e("option", { value: "Düşük" }, "🟢 Düşük")
              ),
              e("select", {
                value: editingItem.data.category,
                onChange: (ev) => setEditingItem(prev => ({ ...prev, data: { ...prev.data, category: ev.target.value } })),
                className: "flex-1 p-1.5 bg-slate-50 dark:bg-slate-800 border rounded-xl text-xs font-bold outline-none"
              },
                e("option", { value: "Üretim" }, "⚙️ Üretim"),
                e("option", { value: "Kalite" }, "🔍 Kalite"),
                e("option", { value: "Yönetim" }, "📋 Yönetim"),
                e("option", { value: "Genel" }, "📌 Genel")
              )
            ),

            editingItem.type === "note" && e("input", {
              type: "text",
              placeholder: "Sorumlu Kişi",
              value: editingItem.data.assignee,
              onChange: (ev) => setEditingItem(prev => ({ ...prev, data: { ...prev.data, assignee: ev.target.value } })),
              className: "w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl text-xs outline-none"
            }),

                    ),
                    e("div", { className: "flex items-center gap-2" },
                      e("button", { onClick: () => setEditingItem({ type: 'note', data: note }), className: "text-slate-400 hover:text-blue-600 text-xs" }, "✏️"),
                      e("button", {
                        onClick: () => {
                          addTask(`[${activeFolderObj.title} - ${activeSessionObj.title}] ${note.content}`);
                          alert("Görevlere aktarıldı!");
                        },
                        className: "text-[10px] font-bold text-blue-600 hover:underline"
                      }, "➡️ Görev Yap")
                    )
                  ),
                  e("p", { className: "text-xs font-semibold text-slate-800 dark:text-slate-100 leading-snug" }, note.content),
                  
                  note.audio && e("audio", { src: note.audio, controls: true, className: "h-8 w-full my-1" }),

                  note.image && e("div", { 
                    onClick: () => setPreviewImageUrl(note.image), 
                    className: "cursor-pointer inline-block mt-1" 
                  },
                    e("img", { src: note.image, className: "w-16 h-12 object-cover rounded-lg border hover:opacity-80 transition-all" })
                  )
                ))
              )
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(e(App));
  </script>
</body>
</html>
