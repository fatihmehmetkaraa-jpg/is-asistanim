<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>İş Asistanım PRO - Kurumsal</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- html2pdf.js for PDF Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 4px; }
    
    /* Dynamic Theme CSS Variables */
    :root {
      --bg-primary: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --accent-color: #2563EB;
    }

    .editor-content [contenteditable]:empty:before {
      content: attr(data-placeholder);
      color: #94a3b8;
      pointer-events: none;
      display: block;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 antialiased selection:bg-blue-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- FIREBASE INITIALIZATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyForInitialSetup_An4",
      authDomain: "is-asistanim-pro.firebaseapp.com",
      projectId: "is-asistanim-pro",
      storageBucket: "is-asistanim-pro.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // --- INITIAL DATA ARCHITECTURE ---
    const initialTasks = [
      { id: '1', title: 'Fotoğraf ekleme deneme', priority: 'Yüksek', category: 'Üretim', date: '2026-07-27', completed: false, note: 'Görsel entegrasyon testi', time: '10:00', image: null, audioUrl: null },
      { id: '2', title: 'Krleşeöröröföff', priority: 'Yüksek', category: 'Üretim', date: '2026-07-27', completed: true, note: 'Kalite kontrol revizyonu', time: '11:30', image: null, audioUrl: null },
      { id: '3', title: 'Mazak 500 arızası', priority: 'Yüksek', category: 'Genel', date: '2026-07-27', completed: true, note: 'Hidrolik basınç valfi değişti', time: '14:00', image: null, audioUrl: null },
      { id: '4', title: 'Sesli Görev / Görsel', priority: 'Düşük', category: 'Genel', date: '2026-07-26', completed: false, note: 'Saha denetim ses kaydı', time: '20:44', image: null, audioUrl: null }
    ];

    const initialMeetings = [
      {
        id: 'm1',
        title: 'Haftalık Üretim ve Kalite Değerlendirmesi',
        folder: 'Üretim Planlama',
        date: '2026-07-25',
        decisions: [
          { id: 'd1', text: 'Mazak 500 tezgahının bakımı tamamlanacak', assignedTo: 'Ahmet Y.', isTask: true },
          { id: 'd2', text: 'Vardiya değişim süreleri 10 dakikaya indirilecek', assignedTo: 'Mehmet K.', isTask: false }
        ]
      }
    ];

    const initialNotes = [
      {
        id: 'n1',
        title: 'Fabrika Otomasyon Notları',
        content: '<p>PLC yazılımlarının yedekleri alındı. <strong>Sensör kalibrasyonları</strong> haftaya salı günü tekrarlanacak.</p>',
        date: '2026-07-27',
        category: 'Yönetim',
        drawingData: null
      }
    ];

    // --- MAIN COMPONENT ---
    function App() {
      // --- NAVIGATION & GENERAL STATES ---
      const [activeTab, setActiveTab] = useState('tasks'); // tasks, meetings, notes, search, profile
      const [selectedDate, setSelectedDate] = useState('2026-07-27');
      
      // Core Data States
      const [tasks, setTasks] = useState(() => JSON.parse(localStorage.getItem('app_tasks')) || initialTasks);
      const [meetings, setMeetings] = useState(() => JSON.parse(localStorage.getItem('app_meetings')) || initialMeetings);
      const [notes, setNotes] = useState(() => JSON.parse(localStorage.getItem('app_notes')) || initialNotes);

      // System & Security States
      const [theme, setTheme] = useState(() => localStorage.getItem('app_theme') || 'default');
      const [pinCode, setPinCode] = useState(() => localStorage.getItem('app_pin') || '');
      const [isLocked, setIsLocked] = useState(() => !!localStorage.getItem('app_pin'));
      const [pinInput, setPinInput] = useState('');
      const [userProfile, setUserProfile] = useState(() => JSON.parse(localStorage.getItem('app_profile')) || {
        name: 'Ahmet Yılmaz',
        title: 'Üretim Müdürü',
        avatar: null
      });

      // Search State
      const [globalSearchQuery, setGlobalSearchQuery] = useState('');

      // Modal States
      const [showTaskModal, setShowTaskModal] = useState(false);
      const [newTaskTitle, setNewTaskTitle] = useState('');
      const [newTaskCategory, setNewTaskCategory] = useState('Üretim');
      const [newTaskPriority, setNewTaskPriority] = useState('Orta');
      const [newTaskNote, setNewTaskNote] = useState('');
      const [newTaskImage, setNewTaskImage] = useState(null);

      // Rich Note & Canvas Drawing States
      const [editingNote, setEditingNote] = useState(null);
      const [isDrawingOpen, setIsDrawingOpen] = useState(false);
      const [penColor, setPenColor] = useState('#2563EB');
      const [penWidth, setPenWidth] = useState(3);
      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);

      // Audio Recording States
      const [isRecording, setIsRecording] = useState(false);
      const [audioRecorder, setAudioRecorder] = useState(null);

      // Persistence Effects
      useEffect(() => { localStorage.setItem('app_tasks', JSON.stringify(tasks)); }, [tasks]);
      useEffect(() => { localStorage.setItem('app_meetings', JSON.stringify(meetings)); }, [meetings]);
      useEffect(() => { localStorage.setItem('app_notes', JSON.stringify(notes)); }, [notes]);

      // Icon Renderer
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // --- CANVAS DRAWING LOGIC ---
      const startDrawing = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
        
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.strokeStyle = penColor;
        ctx.lineWidth = penWidth;
        ctx.lineCap = 'round';
        setIsDrawing(true);
      };

      const draw = (e) => {
        if (!isDrawing) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
        
        ctx.lineTo(x, y);
        ctx.stroke();
      };

      const stopDrawing = () => {
        setIsDrawing(false);
      };

      const clearCanvas = () => {
        const canvas = canvasRef.current;
        if (canvas) {
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      };

      const saveCanvasDrawing = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const dataUrl = canvas.toDataURL();
        if (editingNote) {
          setEditingNote({ ...editingNote, drawingData: dataUrl });
        }
        setIsDrawingOpen(false);
      };

      // --- SPEECH & AUDIO LOGIC ---
      const handleSpeechRecognition = () => {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
          alert('Tarayıcınız canlı ses tanımayı desteklemiyor.');
          return;
        }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'tr-TR';
        recognition.interimResults = false;

        recognition.onstart = () => setIsRecording(true);
        recognition.onresult = (e) => {
          const transcript = e.results[0][0].transcript;
          setNewTaskTitle(prev => prev ? `${prev} ${transcript}` : transcript);
          setIsRecording(false);
        };
        recognition.onerror = () => setIsRecording(false);
        recognition.onend = () => setIsRecording(false);

        recognition.start();
      };

      // --- TASK HANDLERS ---
      const toggleTask = (id) => {
        setTasks(tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
      };

      const handleAddTask = (e) => {
        e.preventDefault();
        if (!newTaskTitle.trim()) return;
        const newTask = {
          id: Date.now().toString(),
          title: newTaskTitle,
          category: newTaskCategory,
          priority: newTaskPriority,
          note: newTaskNote,
          image: newTaskImage,
          date: selectedDate,
          completed: false,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        setTasks([newTask, ...tasks]);
        setNewTaskTitle('');
        setNewTaskNote('');
        setNewTaskImage(null);
        setShowTaskModal(false);
      };

      const deleteTask = (id) => {
        setTasks(tasks.filter(t => t.id !== id));
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setNewTaskImage(reader.result);
          reader.readAsDataURL(file);
        }
      };

      // --- PDF EXPORT FOR MEETINGS ---
      const exportMeetingToPDF = (meeting) => {
        const element = document.createElement('div');
        element.className = "p-8 bg-white text-slate-900";
        element.innerHTML = `
          <div style="font-family: Arial, sans-serif; padding: 20px;">
            <h1 style="color: #1e3a8a; border-bottom: 2px solid #1e3a8a; padding-bottom: 8px;">${meeting.title}</h1>
            <p style="color: #64748b; font-size: 14px;"><strong>Klasör:</strong> ${meeting.folder} | <strong>Tarih:</strong> ${meeting.date}</p>
            <h3 style="margin-top: 20px; color: #334155;">Alınan Kararlar:</h3>
            <ul style="line-height: 1.8;">
              ${meeting.decisions.map(d => `<li><strong>[${d.assignedTo}]:</strong> ${d.text}</li>`).join('')}
            </ul>
          </div>
        `;
        const opt = {
          margin: 10,
          filename: `Toplanti_Tutanagi_${meeting.date}.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2 },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        window.html2pdf().set(opt).from(element).save();
      };

      // --- UNLOCK HANDLER ---
      const handleUnlock = (e) => {
        e.preventDefault();
        if (pinInput === pinCode) {
          setIsLocked(false);
          setPinInput('');
        } else {
          alert('Hatalı PIN!');
          setPinInput('');
        }
      };

      // --- GLOBAL DEEP SEARCH ENGINE ---
      const searchResults = useMemo(() => {
        if (!globalSearchQuery.trim()) return { tasks: [], meetings: [], notes: [] };
        const q = globalSearchQuery.toLowerCase();

        const filteredTasks = tasks.filter(t => 
          t.title.toLowerCase().includes(q) || 
          (t.note && t.note.toLowerCase().includes(q)) ||
          t.category.toLowerCase().includes(q)
        );

        const filteredMeetings = meetings.filter(m => 
          m.title.toLowerCase().includes(q) ||
          m.folder.toLowerCase().includes(q) ||
          m.decisions.some(d => d.text.toLowerCase().includes(q) || d.assignedTo.toLowerCase().includes(q))
        );

        const filteredNotes = notes.filter(n => 
          n.title.toLowerCase().includes(q) ||
          n.content.toLowerCase().includes(q) ||
          (n.category && n.category.toLowerCase().includes(q))
        );

        return { tasks: filteredTasks, meetings: filteredMeetings, notes: filteredNotes };
      }, [globalSearchQuery, tasks, meetings, notes]);

      const totalSearchResults = searchResults.tasks.length + searchResults.meetings.length + searchResults.notes.length;

      // Theme Dynamic Styles
      const getThemeStyle = () => {
        switch(theme) {
          case 'night': return 'bg-slate-900 text-slate-100';
          case 'cream': return 'bg-[#FDFBF7] text-slate-900';
          case 'matrix': return 'bg-black text-emerald-400 font-mono';
          default: return 'bg-slate-100 text-slate-900';
        }
      };

      // --- LOCKED SCREEN ---
      if (isLocked) {
        return (
          <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4 text-white">
            <div className="w-20 h-20 bg-blue-600/20 border border-blue-500/30 rounded-3xl flex items-center justify-center mb-6 shadow-2xl backdrop-blur-xl">
              <i data-lucide="lock" className="w-10 h-10 text-blue-500"></i>
            </div>
            <h2 className="text-2xl font-bold mb-1">İş Asistanım PRO</h2>
            <p className="text-slate-400 text-xs mb-8">Güvenlik PIN Kodunu Giriniz</p>
            <form onSubmit={handleUnlock} className="w-full max-w-xs flex flex-col gap-4">
              <input 
                type="password" 
                maxLength="4"
                value={pinInput}
                onChange={(e) => setPinInput(e.target.value)}
                placeholder="****"
                className="w-full text-center text-3xl tracking-[1em] py-3.5 bg-slate-900 border border-slate-800 rounded-2xl focus:outline-none focus:border-blue-500 text-white shadow-inner"
              />
              <button type="submit" className="w-full py-3.5 bg-blue-600 hover:bg-blue-500 font-bold rounded-2xl transition-all shadow-lg shadow-blue-600/30 text-sm">
                Sisteme Giriş Yap
              </button>
            </form>
          </div>
        );
      }

      return (
        <div className={`min-h-screen flex flex-col pb-24 ${getThemeStyle()}`}>
          
          {/* HEADER */}
          <header className="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border-b border-slate-200/80 dark:border-slate-800 px-4 py-3 flex items-center justify-between shadow-sm">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-blue-500/20">
                <i data-lucide="zap" className="w-5 h-5 fill-current"></i>
              </div>
              <div>
                <h1 className="font-bold text-base leading-tight">İş Asistanım PRO</h1>
                <div className="flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span className="text-[11px] font-medium text-slate-500">Kurumsal Bulut Active</span>
                </div>
              </div>
            </div>
            
            <div className="flex items-center gap-2">
              <button 
                onClick={() => setTheme(theme === 'night' ? 'default' : 'night')}
                className="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition-colors"
              >
                <i data-lucide={theme === 'night' ? 'sun' : 'moon'} className="w-4 h-4"></i>
              </button>
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main className="flex-1 max-w-2xl w-full mx-auto p-4">
            
            {/* TASKS VIEW */}
            {activeTab === 'tasks' && (
              <div className="space-y-4">
                {/* DATE STRIP */}
                <div className="bg-slate-900 text-white p-3.5 rounded-2xl shadow-xl">
                  <div className="flex items-center justify-between mb-3 px-1">
                    <span className="text-xs font-semibold flex items-center gap-1.5 text-slate-300">
                      <i data-lucide="calendar" className="w-4 h-4 text-blue-400"></i> Takvim & Planlama
                    </span>
                    <span className="text-xs bg-slate-800 px-2.5 py-1 rounded-lg border border-slate-700 text-blue-300 font-mono">
                      27 Tem 2026
                    </span>
                  </div>
                  <div className="grid grid-cols-7 gap-1 text-center">
                    {['CUM 24', 'CMT 25', 'PAZ 26', 'BUGÜN 27', 'SAL 28', 'ÇAR 29', 'PER 30'].map((d, idx) => {
                      const isToday = idx === 3;
                      return (
                        <button 
                          key={idx} 
                          className={`py-2 rounded-xl flex flex-col items-center justify-center transition-all ${
                            isToday ? 'bg-blue-600 text-white font-bold shadow-lg shadow-blue-500/30' : 'hover:bg-slate-800 text-slate-400'
                          }`}
                        >
                          <span className="text-[10px] opacity-70">{d.split(' ')[0]}</span>
                          <span className="text-xs font-semibold">{d.split(' ')[1]}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* TASK ACTION BAR */}
                <div className="grid grid-cols-3 gap-2">
                  <button 
                    onClick={() => setShowTaskModal(true)}
                    className="flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white py-3 px-3 rounded-2xl font-semibold text-xs transition-colors shadow-md shadow-blue-500/20"
                  >
                    <i data-lucide="plus" className="w-4 h-4"></i> Görev Ekle
                  </button>
                  <button 
                    onClick={handleSpeechRecognition}
                    className={`flex items-center justify-center gap-1.5 bg-white border border-slate-200 text-slate-700 py-3 px-3 rounded-2xl font-semibold text-xs hover:bg-slate-50 transition-colors shadow-sm ${
                      isRecording ? 'border-rose-500 text-rose-600 animate-pulse' : ''
                    }`}
                  >
                    <i data-lucide="mic" className="w-4 h-4 text-slate-500"></i> {isRecording ? 'Dinleniyor...' : 'Sesli Görev'}
                  </button>
                  <button 
                    onClick={() => setShowTaskModal(true)}
                    className="flex items-center justify-center gap-1.5 bg-white border border-slate-200 text-slate-700 py-3 px-3 rounded-2xl font-semibold text-xs hover:bg-slate-50 transition-colors shadow-sm"
                  >
                    <i data-lucide="camera" className="w-4 h-4 text-slate-500"></i> Fotoğraflı
                  </button>
                </div>

                {/* TASK CARDS */}
                <div className="space-y-2.5">
                  {tasks.map(task => (
                    <div 
                      key={task.id} 
                      className={`p-4 rounded-2xl border transition-all ${
                        task.completed 
                          ? 'bg-slate-50/80 border-slate-200 opacity-60' 
                          : 'bg-white border-slate-200/80 shadow-sm hover:shadow-md'
                      }`}
                    >
                      <div className="flex items-start justify-between gap-3">
                        <div className="flex items-start gap-3 flex-1">
                          <button 
                            onClick={() => toggleTask(task.id)}
                            className={`mt-0.5 w-5 h-5 rounded-lg border flex items-center justify-center transition-colors ${
                              task.completed ? 'bg-blue-600 border-blue-600 text-white' : 'border-slate-300 bg-white'
                            }`}
                          >
                            {task.completed && <i data-lucide="check" className="w-3.5 h-3.5 stroke-[3]"></i>}
                          </button>
                          <div className="flex-1">
                            <h3 className={`font-semibold text-slate-800 text-sm ${task.completed ? 'line-through text-slate-400' : ''}`}>
                              {task.title}
                            </h3>
                            {task.note && <p className="text-xs text-slate-500 mt-1">{task.note}</p>}
                            {task.image && (
                              <img src={task.image} alt="Görev Görseli" className="mt-2 w-full max-h-40 object-cover rounded-xl border border-slate-200" />
                            )}
                            <div className="flex items-center gap-2 mt-2">
                              <span className={`text-[10px] px-2 py-0.5 rounded-md font-bold ${
                                task.priority === 'Yüksek' ? 'bg-rose-100 text-rose-700' : 
                                task.priority === 'Orta' ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-600'
                              }`}>
                                {task.priority}
                              </span>
                              <span className="text-[10px] px-2 py-0.5 rounded-md font-medium bg-slate-100 text-slate-600">
                                {task.category}
                              </span>
                            </div>
                          </div>
                        </div>

                        <div className="flex flex-col items-end justify-between self-stretch">
                          <button onClick={() => deleteTask(task.id)} className="p-1 text-slate-400 hover:text-rose-600 transition-colors">
                            <i data-lucide="trash-2" className="w-4 h-4"></i>
                          </button>
                          <span className="text-[11px] text-slate-400 font-mono">{task.date}</span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* MEETINGS VIEW */}
            {activeTab === 'meetings' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <div>
                    <h2 className="text-lg font-bold text-slate-800">Toplantı Kararları</h2>
                    <p className="text-xs text-slate-500">Tutanak oluşturun, kararları görevlere aktarın ve PDF alın.</p>
                  </div>
                  <button className="bg-blue-600 text-white text-xs px-3.5 py-2.5 rounded-xl font-bold flex items-center gap-1 shadow-md shadow-blue-500/20">
                    <i data-lucide="plus" className="w-4 h-4"></i> Yeni Toplantı
                  </button>
                </div>

                {meetings.map(m => (
                  <div key={m.id} className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                    <div className="flex items-start justify-between border-b border-slate-100 pb-3">
                      <div>
                        <span className="text-[11px] font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-lg">
                          {m.folder}
                        </span>
                        <h3 className="font-bold text-slate-800 mt-2 text-base">{m.title}</h3>
                      </div>
                      <div className="flex items-center gap-2">
                        <button 
                          onClick={() => exportMeetingToPDF(m)}
                          className="p-1.5 text-slate-500 hover:text-blue-600 bg-slate-50 rounded-lg border border-slate-200"
                          title="PDF Olarak İndir"
                        >
                          <i data-lucide="download" className="w-4 h-4"></i>
                        </button>
                        <span className="text-xs text-slate-400 font-mono">{m.date}</span>
                      </div>
                    </div>

                    <div className="space-y-2">
                      <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider">Alınan Kararlar:</h4>
                      {m.decisions.map(d => (
                        <div key={d.id} className="p-3 rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-between text-xs">
                          <span className="text-slate-700 font-medium">{d.text}</span>
                          <span className="text-[10px] font-bold text-slate-600 bg-white px-2 py-1 rounded-md border shadow-2xs">{d.assignedTo}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* NOTES & DRAWING VIEW */}
            {activeTab === 'notes' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <div>
                    <h2 className="text-lg font-bold text-slate-800">Gelişmiş Notlarım</h2>
                    <p className="text-xs text-slate-500">iOS Notes tarzı zengin metin ve tuval üzerine çizim yapma imkanı.</p>
                  </div>
                  <button className="bg-blue-600 text-white text-xs px-3.5 py-2.5 rounded-xl font-bold flex items-center gap-1 shadow-md shadow-blue-500/20">
                    <i data-lucide="plus" className="w-4 h-4"></i> Yeni Not
                  </button>
                </div>

                {notes.map(n => (
                  <div key={n.id} className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                    <div className="flex items-center justify-between border-b pb-2">
                      <h3 className="font-bold text-slate-800 text-base">{n.title}</h3>
                      <span className="text-xs text-slate-400 font-mono">{n.date}</span>
                    </div>
                    <div className="text-xs text-slate-600 leading-relaxed" dangerouslySetInnerHTML={{ __html: n.content }}></div>
                    {n.drawingData && (
                      <div className="mt-2 border rounded-xl overflow-hidden bg-slate-50 p-2">
                        <span className="text-[10px] text-slate-400 font-bold block mb-1">EKLENEN ÇİZİM:</span>
                        <img src={n.drawingData} alt="Çizim" className="max-h-48 mx-auto" />
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}

            {/* GLOBAL SEARCH / CORPORATE BRAIN VIEW */}
            {activeTab === 'search' && (
              <div className="space-y-4">
                <div>
                  <h2 className="text-lg font-bold text-slate-800">Kurumsal Hafıza & Arama</h2>
                  <p className="text-xs text-slate-500">Tüm sistem veritabanı (Görevler, Toplantılar, Notlar) anında taranır.</p>
                </div>

                {/* SEARCH INPUT */}
                <div className="relative">
                  <i data-lucide="search" className="w-5 h-5 absolute left-3.5 top-3.5 text-slate-400"></i>
                  <input 
                    type="text" 
                    value={globalSearchQuery}
                    onChange={(e) => setGlobalSearchQuery(e.target.value)}
                    placeholder="Tüm kayıtlarda derin arama yapın (Örn: Mazak, Kalite, Bakım)..."
                    className="w-full pl-11 pr-10 py-3.5 bg-white border border-slate-200 rounded-2xl text-sm focus:outline-none focus:border-blue-500 shadow-sm"
                  />
                  {globalSearchQuery && (
                    <button 
                      onClick={() => setGlobalSearchQuery('')} 
                      className="absolute right-3.5 top-3.5 text-slate-400 hover:text-slate-600 text-xs bg-slate-100 rounded-full w-5 h-5 flex items-center justify-center"
                    >
                      ✕
                    </button>
                  )}
                </div>

                {/* RESULTS AREA */}
                {globalSearchQuery.trim() ? (
                  <div className="space-y-4">
                    <div className="text-xs text-slate-500 font-medium px-1">
                      Toplam <strong>{totalSearchResults}</strong> eşleşen kayıt bulundu.
                    </div>

                    {/* TASKS MATCH */}
                    {searchResults.tasks.length > 0 && (
                      <div className="space-y-2">
                        <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                          <i data-lucide="check-square" className="w-4 h-4 text-blue-600"></i> Görevler ({searchResults.tasks.length})
                        </h3>
                        {searchResults.tasks.map(t => (
                          <div 
                            key={t.id} 
                            onClick={() => setActiveTab('tasks')}
                            className="bg-white p-3.5 rounded-xl border border-slate-200 shadow-2xs cursor-pointer hover:border-blue-400 transition-colors"
                          >
                            <div className="font-bold text-slate-800 text-sm">{t.title}</div>
                            {t.note && <p className="text-xs text-slate-500 mt-1">{t.note}</p>}
                            <div className="text-[10px] text-slate-400 mt-2 flex items-center gap-2 font-mono">
                              <span>Tarih: {t.date}</span>
                              <span>•</span>
                              <span>Kategori: {t.category}</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}

                    {/* MEETINGS MATCH */}
                    {searchResults.meetings.length > 0 && (
                      <div className="space-y-2">
                        <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                          <i data-lucide="folder" className="w-4 h-4 text-amber-600"></i> Toplantı Kararları ({searchResults.meetings.length})
                        </h3>
                        {searchResults.meetings.map(m => (
                          <div 
                            key={m.id} 
                            onClick={() => setActiveTab('meetings')}
                            className="bg-white p-3.5 rounded-xl border border-slate-200 shadow-2xs cursor-pointer hover:border-amber-400 transition-colors space-y-1.5"
                          >
                            <div className="font-bold text-slate-800 text-sm">{m.title}</div>
                            <div className="text-xs text-slate-600 bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                              {m.decisions.map(d => `${d.assignedTo}: ${d.text}`).join(' | ')}
                            </div>
                            <div className="text-[10px] text-slate-400 font-mono">Klasör: {m.folder} • {m.date}</div>
                          </div>
                        ))}
                      </div>
                    )}

                    {/* NOTES MATCH */}
                    {searchResults.notes.length > 0 && (
                      <div className="space-y-2">
                        <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                          <i data-lucide="file-text" className="w-4 h-4 text-emerald-600"></i> Notlar ({searchResults.notes.length})
                        </h3>
                        {searchResults.notes.map(n => (
                          <div 
                            key={n.id} 
                            onClick={() => setActiveTab('notes')}
                            className="bg-white p-3.5 rounded-xl border border-slate-200 shadow-2xs cursor-pointer hover:border-emerald-400 transition-colors"
                          >
                            <div className="font-bold text-slate-800 text-sm">{n.title}</div>
                            <div className="text-xs text-slate-500 mt-1 line-clamp-2" dangerouslySetInnerHTML={{ __html: n.content }}></div>
                            <div className="text-[10px] text-slate-400 mt-2 font-mono">{n.date}</div>
                          </div>
                        ))}
                      </div>
                    )}

                    {totalSearchResults === 0 && (
                      <div className="text-center py-12 bg-white rounded-2xl border border-slate-200 text-slate-400">
                        <i data-lucide="search-x" className="w-10 h-10 mx-auto mb-2 opacity-40"></i>
                        <p className="text-sm font-medium">Hiçbir sonuç bulunamadı.</p>
                      </div>
                    )}
                  </div>
                ) : (
                  <div className="text-center py-12 bg-white rounded-2xl border border-slate-200 text-slate-400">
                    <i data-lucide="cpu" className="w-10 h-10 mx-auto mb-2 opacity-40 text-blue-500"></i>
                    <p className="text-sm font-bold text-slate-700">Kurumsal Hafıza Aktif</p>
                    <p className="text-xs text-slate-400 mt-1">Geriye dönük tüm karar ve verilerinize anında ulaşmak için arama yapın.</p>
                  </div>
                )}
              </div>
            )}

            {/* PROFILE & SETTINGS VIEW */}
            {activeTab === 'profile' && (
              <div className="space-y-4">
                <div className="bg-white p-6 rounded-2xl border border-slate-200 text-center space-y-3 shadow-sm">
                  <div className="w-20 h-20 bg-gradient-to-tr from-blue-600 to-indigo-600 text-white rounded-full mx-auto flex items-center justify-center text-2xl font-bold border-4 border-white shadow-md">
                    {userProfile.name.split(' ').map(n=>n[0]).join('')}
                  </div>
                  <div>
                    <h2 className="text-lg font-bold text-slate-800">{userProfile.name}</h2>
                    <p className="text-xs text-slate-500">{userProfile.title}</p>
                  </div>
                </div>

                <div className="bg-white p-4 rounded-2xl border border-slate-200 space-y-3 shadow-sm">
                  <h3 className="text-sm font-bold text-slate-800">Tema Ve Görünüm</h3>
                  <div className="grid grid-cols-3 gap-2">
                    {[
                      { id: 'default', label: 'Varsayılan' },
                      { id: 'night', label: 'Gece Modu' },
                      { id: 'cream', label: 'Soft Krem' }
                    ].map(t => (
                      <button 
                        key={t.id}
                        onClick={() => setTheme(t.id)}
                        className={`py-2 px-3 rounded-xl text-xs font-semibold border ${
                          theme === t.id ? 'border-blue-600 bg-blue-50 text-blue-600' : 'border-slate-200 text-slate-600'
                        }`}
                      >
                        {t.label}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="bg-white p-4 rounded-2xl border border-slate-200 space-y-3 shadow-sm">
                  <h3 className="text-sm font-bold text-slate-800">Güvenlik</h3>
                  <div className="flex items-center justify-between">
                    <div>
                      <div className="text-xs font-semibold text-slate-700">Uygulama Kilit PIN Kodu</div>
                      <div className="text-[10px] text-slate-400">Açılışta 4 haneli PIN ister.</div>
                    </div>
                    <button 
                      onClick={() => {
                        if (pinCode) {
                          setPinCode('');
                          localStorage.removeItem('app_pin');
                          alert('PIN Kodu Devre Dışı Bırakıldı.');
                        } else {
                          const code = prompt('4 Haneli Güvenlik PIN Kodu Belirleyin:');
                          if (code && code.length === 4) {
                            setPinCode(code);
                            localStorage.setItem('app_pin', code);
                            alert('PIN Kodu Aktif Edildi!');
                          }
                        }
                      }}
                      className={`text-xs px-3.5 py-2 rounded-xl font-bold ${
                        pinCode ? 'bg-rose-100 text-rose-700' : 'bg-slate-100 text-slate-700'
                      }`}
                    >
                      {pinCode ? 'PIN Kodu Kaldır' : 'PIN Aktif Et'}
                    </button>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* TASK ADD MODAL */}
          {showTaskModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-6 space-y-4 shadow-2xl animate-in slide-in-from-bottom duration-200">
                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="font-bold text-slate-800">Yeni Görev Oluştur</h3>
                  <button onClick={() => setShowTaskModal(false)} className="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <form onSubmit={handleAddTask} className="space-y-3">
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Görev Başlığı</label>
                    <input 
                      type="text" 
                      required
                      value={newTaskTitle}
                      onChange={(e) => setNewTaskTitle(e.target.value)}
                      placeholder="Örn: Kalite Kontrol Raporu Hazırlanacak"
                      className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-semibold text-slate-600 block mb-1">Kategori</label>
                      <select 
                        value={newTaskCategory}
                        onChange={(e) => setNewTaskCategory(e.target.value)}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none"
                      >
                        <option value="Üretim">Üretim</option>
                        <option value="Kalite">Kalite</option>
                        <option value="Yönetim">Yönetim</option>
                        <option value="Bakım">Bakım</option>
                        <option value="Genel">Genel</option>
                      </select>
                    </div>

                    <div>
                      <label className="text-xs font-semibold text-slate-600 block mb-1">Öncelik</label>
                      <select 
                        value={newTaskPriority}
                        onChange={(e) => setNewTaskPriority(e.target.value)}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none"
                      >
                        <option value="Düşük">Düşük</option>
                        <option value="Orta">Orta</option>
                        <option value="Yüksek">Yüksek</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Fotoğraf Ekle</label>
                    <input 
                      type="file" 
                      accept="image/*"
                      onChange={handleImageUpload}
                      className="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Not / Açıklama</label>
                    <textarea 
                      rows="3"
                      value={newTaskNote}
                      onChange={(e) => setNewTaskNote(e.target.value)}
                      placeholder="Ekstra açıklamalar..."
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none"
                    ></textarea>
                  </div>

                  <button 
                    type="submit" 
                    className="w-full py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition-colors shadow-md shadow-blue-500/20 text-sm"
                  >
                    Görev Kaydet
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* BOTTOM NAVIGATION BAR */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-lg border-t border-slate-200 dark:border-slate-800 py-2.5 px-4 shadow-lg">
            <div className="max-w-md mx-auto flex items-center justify-around">
              
              <button 
                onClick={() => setActiveTab('tasks')}
                className={`flex flex-col items-center gap-1 transition-colors ${
                  activeTab === 'tasks' ? 'text-blue-600 font-bold' : 'text-slate-400 hover:text-slate-600'
                }`}
              >
                <i data-lucide="check-square" className="w-5 h-5"></i>
                <span className="text-[10px]">Görevler</span>
              </button>

              <button 
                onClick={() => setActiveTab('meetings')}
                className={`flex flex-col items-center gap-1 transition-colors ${
                  activeTab === 'meetings' ? 'text-blue-600 font-bold' : 'text-slate-400 hover:text-slate-600'
                }`}
              >
                <i data-lucide="folder" className="w-5 h-5"></i>
                <span className="text-[10px]">Toplantılar</span>
              </button>

              {/* INTEGRATED GLOBAL SEARCH BUTTON */}
              <button 
                onClick={() => setActiveTab('search')}
                className={`flex flex-col items-center gap-1 transition-colors ${
                  activeTab === 'search' ? 'text-blue-600 font-bold' : 'text-slate-400 hover:text-slate-600'
                }`}
              >
                <i data-lucide="search" className="w-5 h-5"></i>
                <span className="text-[10px]">Arama</span>
              </button>

              <button 
                onClick={() => setActiveTab('notes')}
                className={`flex flex-col items-center gap-1 transition-colors ${
                  activeTab === 'notes' ? 'text-blue-600 font-bold' : 'text-slate-400 hover:text-slate-600'
                }`}
              >
                <i data-lucide="file-text" className="w-5 h-5"></i>
                <span className="text-[10px]">Notlarım</span>
              </button>

              <button 
                onClick={() => setActiveTab('profile')}
                className={`flex flex-col items-center gap-1 transition-colors ${
                  activeTab === 'profile' ? 'text-blue-600 font-bold' : 'text-slate-400 hover:text-slate-600'
                }`}
              >
                <div className="w-5 h-5 rounded-full bg-slate-200 overflow-hidden flex items-center justify-center text-[10px] font-bold text-slate-700 border border-slate-300">
                  {userProfile.name[0]}
                </div>
                <span className="text-[10px]">Siz</span>
              </button>

            </div>
          </nav>

        </div>
      );
    }

    // Render React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
