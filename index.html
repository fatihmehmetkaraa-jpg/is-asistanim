<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İş Asistanım PRO</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Özel Doku ve Arka Plan Stilleri */
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s ease;
        }

        .bg-dotted {
            background-image: radial-gradient(#334155 1px, transparent 1px);
            background-size: 16px 16px;
        }

        .bg-grid {
            background-image: linear-gradient(to right, #1e293b 1px, transparent 1px), linear-gradient(to bottom, #1e293b 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Toplantı Tutanağı Metin Okunabilirlik Düzeltmesi */
        .tutanak-container {
            background-color: #ffffff !important;
            color: #0f172a !important;
        }

        .tutanak-text {
            color: #1e293b !important; /* Beyaz kalma sorununu çözen koyu kontrast */
            font-weight: 500;
        }

        .tutanak-header {
            border-bottom: 2px solid #1e3a8a;
        }

        /* Gizleme Yardımcı Sınıfı */
        .hidden-element {
            display: none !important;
        }
    </style>
</head>
<body id="appBody" class="min-h-screen pb-24 select-none">

    <!-- 1. İLK AÇILIŞ / VERİ EŞİTLEME EKRANI -->
    <div id="loadingScreen" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-white text-sm font-medium tracking-wide">Veriler eşitleniyor...</p>
    </div>

    <!-- 2. ÜST BİLGİ ÇUBUĞU (HEADER) -->
    <header class="flex items-center justify-between px-5 py-4 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/30">
                <span class="text-yellow-300 font-bold text-xl">⚡</span>
            </div>
            <div>
                <h1 class="font-bold text-base tracking-tight leading-none text-white">İş Asistanım PRO</h1>
                <span class="text-[11px] text-blue-400 font-medium">Kurumsal Bulut Active</span>
            </div>
        </div>
        <button onclick="toggleDarkMode()" class="p-2 rounded-xl bg-slate-800 text-amber-400 hover:bg-slate-700 transition">
            ☀️
        </button>
    </header>

    <!-- ANA İÇERİK -->
    <main class="p-4 max-w-md mx-auto">

        <!-- 3. TARİH SEÇİMİ BLOĞU -->
        <div id="dateCard" class="rounded-2xl p-4 mb-4 shadow-xl border border-white/10 transition-colors duration-300 bg-blue-700">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center gap-2">
                    <span class="text-white opacity-80 text-sm">📅</span>
                    <span class="font-semibold text-sm text-white">Tarih Seçimi</span>
                </div>
                <!-- Senkronize Tarih -->
                <div id="selectedDateDisplay" class="bg-white/20 backdrop-blur-md px-3 py-1 rounded-lg text-xs font-bold text-white tracking-wide">
                    26 Tem 2026
                </div>
            </div>

            <!-- Takvim Şeridi -->
            <div class="grid grid-cols-7 gap-1 text-center">
                <button onclick="selectDate('23', this)" class="date-btn py-2 rounded-xl flex flex-col items-center hover:bg-white/10 text-white/80"><span class="text-[9px] opacity-80">PER</span><span class="text-sm font-semibold">23</span></button>
                <button onclick="selectDate('24', this)" class="date-btn py-2 rounded-xl flex flex-col items-center hover:bg-white/10 text-white/80"><span class="text-[9px] opacity-80">CUM</span><span class="text-sm font-semibold">24</span></button>
                <button onclick="selectDate('25', this)" class="date-btn py-2 rounded-xl flex flex-col items-center hover:bg-white/10 text-white/80"><span class="text-[9px] opacity-80">CMT</span><span class="text-sm font-semibold">25</span></button>
                <button onclick="selectDate('26', this)" class="date-btn py-2 rounded-xl flex flex-col items-center bg-white text-blue-900 font-bold shadow-md scale-105"><span class="text-[9px] opacity-80">BUGÜN</span><span class="text-sm font-semibold">26</span></button>
                <button onclick="selectDate('27', this)" class="date-btn py-2 rounded-xl flex flex-col items-center hover:bg-white/10 text-white/80"><span class="text-[9px] opacity-80">PZT</span><span class="text-sm font-semibold">27</span></button>
                <button onclick="selectDate('28', this)" class="date-btn py-2 rounded-xl flex flex-col items-center hover:bg-white/10 text-white/80"><span class="text-[9px] opacity-80">SAL</span><span class="text-sm font-semibold">28</span></button>
                <button onclick="selectDate('29', this)" class="date-btn py-2 rounded-xl flex flex-col items-center hover:bg-white/10 text-white/80"><span class="text-[9px] opacity-80">ÇAR</span><span class="text-sm font-semibold">29</span></button>
            </div>
        </div>

        <!-- 4. AKSİYON BUTONLARI -->
        <div id="actionButtons" class="grid grid-cols-3 gap-2 mb-5">
            <button onclick="openTaskForm()" class="py-2.5 px-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-medium text-xs text-white flex items-center justify-center gap-1.5 shadow-md transition">
                ➕ Görev
            </button>
            <button class="py-2.5 px-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl font-medium text-xs text-slate-200 flex items-center justify-center gap-1.5 transition">
                🎙️ Sesli Not
            </button>
            <button class="py-2.5 px-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl font-medium text-xs text-slate-200 flex items-center justify-center gap-1.5 transition">
                📷 Fotoğraflı
            </button>
        </div>

        <!-- 5. GÖREV EKLEME FORMU (Varsayılan Olarak Gizli) -->
        <div id="taskFormContainer" class="hidden-element bg-slate-800/90 border border-slate-700 rounded-2xl p-5 shadow-2xl backdrop-blur-xl mb-5">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
                <h2 class="text-lg font-semibold text-white">Yeni Görev Oluştur</h2>
                <button onclick="closeTaskForm()" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-medium text-slate-200">Kapat</button>
            </div>

            <form onsubmit="handleAddTask(event)" class="space-y-4">
                <input id="taskTitle" type="text" placeholder="Görev tanımı..." required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 text-sm">
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-slate-400 mb-1 block">Öncelik</label>
                        <select id="taskPriority" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white">
                            <option value="Yüksek">🔴 Yüksek</option>
                            <option value="Orta">🟡 Orta</option>
                            <option value="Düşük">🟢 Düşük</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 mb-1 block">Kategori / Tür</label>
                        <select id="taskCategory" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white">
                            <option value="Üretim">⚙️ Üretim</option>
                            <option value="Genel">📋 Genel</option>
                            <option value="Toplantı">🤝 Toplantı</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="text-xs text-slate-400 mb-2 block">Kart Rengi</label>
                    <div class="flex gap-3">
                        <button type="button" onclick="selectCardColor('#ffffff')" class="w-7 h-7 rounded-full bg-white border-2 border-blue-500"></button>
                        <button type="button" onclick="selectCardColor('#fce8e6')" class="w-7 h-7 rounded-full bg-red-100"></button>
                        <button type="button" onclick="selectCardColor('#e6f4ea')" class="w-7 h-7 rounded-full bg-green-100"></button>
                        <button type="button" onclick="selectCardColor('#e8f0fe')" class="w-7 h-7 rounded-full bg-blue-100"></button>
                        <button type="button" onclick="selectCardColor('#fef7e0')" class="w-7 h-7 rounded-full bg-yellow-100"></button>
                    </div>
                </div>

                <div>
                    <label class="text-xs text-slate-400 mb-1 block">⏰ Alarm Zamanı & Bildirim Tipi</label>
                    <div class="flex gap-2">
                        <input id="taskTime" type="time" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white flex-1">
                        <select class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white flex-1">
                            <option>🔔 Ses + Titreşim</option>
                            <option>🔕 Sessiz</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 font-semibold text-white rounded-xl shadow-lg shadow-blue-600/30 transition text-sm">Kaydet</button>
            </form>
        </div>

        <!-- 6. GÖREV LİSTESİ ALANI -->
        <div id="taskListContainer" class="space-y-3">
            <!-- JS Tarafından Dinamik Doldurulacak -->
        </div>

        <!-- 7. TEMA VE ÖZEL RENK PALETİ ALANI -->
        <div id="themeSection" class="mt-8 bg-slate-800/80 border border-slate-700/80 rounded-2xl overflow-hidden shadow-xl">
            <button onclick="toggleThemeAccordion()" class="w-full px-4 py-3.5 flex items-center justify-between text-slate-200 hover:bg-slate-700/50 transition font-medium text-sm">
                <div class="flex items-center gap-2">
                    <span>🎨</span>
                    <span>Temalar ve Görünüm Özelleştirme</span>
                </div>
                <span id="accordionIcon">▼</span>
            </button>

            <div id="themeAccordionContent" class="hidden-element p-4 border-t border-slate-700/80 space-y-4">
                <div>
                    <label class="text-xs font-semibold text-slate-400 block mb-2">Hazır Temalar</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="applyPresetTheme('#0f172a', '#1d4ed8', '')" class="p-2.5 rounded-xl border border-slate-700 bg-slate-900/50 text-slate-300 text-xs text-left">Kurumsal Koyu</button>
                        <button onclick="applyPresetTheme('#f8fafc', '#2563eb', '')" class="p-2.5 rounded-xl border border-slate-700 bg-slate-900/50 text-slate-300 text-xs text-left">Açık Minimal</button>
                        <button onclick="applyPresetTheme('#fef3c7', '#d97706', '')" class="p-2.5 rounded-xl border border-slate-700 bg-slate-900/50 text-slate-300 text-xs text-left">Sıcak Krem</button>
                        <button onclick="applyPresetTheme('#0f172a', '#1e40af', 'bg-dotted')" class="p-2.5 rounded-xl border border-slate-700 bg-slate-900/50 text-slate-300 text-xs text-left">Noktalı Doku</button>
                        <button onclick="applyPresetTheme('#0f172a', '#2563eb', 'bg-grid')" class="p-2.5 rounded-xl border border-slate-700 bg-slate-900/50 text-slate-300 text-xs text-left">Izgara Doku</button>
                    </div>
                </div>

                <!-- ÇİFT RENK PALETİ SEÇİCİLERİ -->
                <div class="pt-3 border-t border-slate-700/60 space-y-3">
                    <label class="text-xs font-semibold text-slate-400 block">Özel Renk Paleti (Canlı Önizleme)</label>
                    
                    <!-- Tarih Bloğu Rengi -->
                    <div class="flex items-center justify-between bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/50">
                        <span class="text-xs text-slate-300">Tarih Bloğu Arka Planı</span>
                        <input type="color" id="dateColorPicker" value="#1d4ed8" oninput="changeDateCardBg(this.value)" class="w-8 h-8 rounded cursor-pointer bg-transparent border-0">
                    </div>

                    <!-- Uygulama Genel Arka Plan Rengi -->
                    <div class="flex items-center justify-between bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/50">
                        <span class="text-xs text-slate-300">Uygulama Genel Arka Planı</span>
                        <input type="color" id="bgColorPicker" value="#0f172a" oninput="changeAppBg(this.value)" class="w-8 h-8 rounded cursor-pointer bg-transparent border-0">
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- 8. ALT GEZİNME ÇUBUĞU (FOOTER NAV) -->
    <nav id="bottomNav" class="fixed bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur-lg border-t border-slate-800 px-6 py-2.5 z-40">
        <div class="max-w-md mx-auto flex justify-between items-center text-slate-400">
            <button class="flex flex-col items-center gap-1 text-blue-500 font-bold">
                <span>✅</span>
                <span class="text-[11px]">Görevler</span>
            </button>
            <button class="flex flex-col items-center gap-1 hover:text-slate-200">
                <span>📁</span>
                <span class="text-[11px]">Toplantılar</span>
            </button>
            <button class="flex flex-col items-center gap-1 hover:text-slate-200">
                <span>👤</span>
                <span class="text-[11px]">Siz</span>
            </button>
        </div>
    </nav>

    <!-- JS MANTIĞI & VERİ YÖNETİMİ -->
    <script>
        // Örnek Veri Seti
        let tasks = [
            { id: 1, title: 'Deneme2', priority: 'Yüksek', category: 'Üretim', date: '2026-07-25', color: '#1e293b' },
            { id: 2, title: 'Mazak 500 arızası', priority: 'Yüksek', category: 'Genel', date: '2026-07-25', color: '#e6f4ea' },
            { id: 3, title: 'Ses kaydı notu deneme 1', priority: 'Yüksek', category: 'Üretim', date: '2026-07-25', color: '#fce8e6' }
        ];

        let selectedColor = '#ffffff';

        // 1. AÇILIŞ SENKRONİZASYONU VE REAKTİF YÜKLEME
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('loadingScreen').classList.add('hidden-element');
                renderTasks(); // Eşitleme bittiği an liste anında yüklenir
            }, 800);
        });

        // 2. GÖREV LİSTESİNİ EKRANA BASMA
        function renderTasks() {
            const container = document.getElementById('taskListContainer');
            container.innerHTML = '';

            tasks.forEach(task => {
                const isLight = task.color !== '#1e293b' && task.color !== '#ffffff';
                const textColor = isLight ? '#0f172a' : '#ffffff';

                const card = document.createElement('div');
                card.className = "p-4 rounded-2xl border border-slate-700/60 shadow-lg relative overflow-hidden flex items-start justify-between";
                card.style.backgroundColor = task.color === '#ffffff' ? '#1e293b' : task.color;
                card.style.color = textColor;

                card.innerHTML = `
                    <div class="flex items-start gap-3">
                        <input type="checkbox" class="mt-1 w-4 h-4 rounded border-slate-400 text-blue-600">
                        <div>
                            <h3 class="font-semibold text-sm">${task.title}</h3>
                            <div class="flex gap-2 mt-2">
                                <span class="px-2 py-0.5 bg-red-500/20 text-red-400 border border-red-500/30 text-[10px] font-bold rounded-md">${task.priority}</span>
                                <span class="px-2 py-0.5 bg-slate-700/50 text-slate-300 text-[10px] font-medium rounded-md">${task.category}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex flex-col items-end justify-between gap-3">
                        <div class="flex gap-2 text-xs">
                            <button onclick="deleteTask(${task.id})" class="text-red-400 hover:opacity-80">🗑️</button>
                        </div>
                        <span class="text-[10px] opacity-60 font-mono">${task.date}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 3. GÖREV EKLEME EKRANI (Sadeliği Sağlamak İçin Diğer Alanlar Gizlenir)
        function openTaskForm() {
            document.getElementById('taskFormContainer').classList.remove('hidden-element');
            document.getElementById('taskListContainer').classList.add('hidden-element');
            document.getElementById('themeSection').classList.add('hidden-element');
            document.getElementById('bottomNav').classList.add('hidden-element');
            document.getElementById('actionButtons').classList.add('hidden-element');
        }

        function closeTaskForm() {
            document.getElementById('taskFormContainer').classList.add('hidden-element');
            document.getElementById('taskListContainer').classList.remove('hidden-element');
            document.getElementById('themeSection').classList.remove('hidden-element');
            document.getElementById('bottomNav').classList.remove('hidden-element');
            document.getElementById('actionButtons').classList.remove('hidden-element');
        }

        function handleAddTask(e) {
            e.preventDefault();
            const title = document.getElementById('taskTitle').value;
            const priority = document.getElementById('taskPriority').value;
            const category = document.getElementById('taskCategory').value;

            const newTask = {
                id: Date.now(),
                title: title,
                priority: priority,
                category: category,
                date: '2026-07-26',
                color: selectedColor
            };

            tasks.unshift(newTask);
            renderTasks();
            closeTaskForm();
            document.getElementById('taskTitle').value = '';
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            renderTasks();
        }

        function selectCardColor(color) {
            selectedColor = color;
        }

        // 4. TARİH ŞERİDİ SENKRONİZASYONU
        function selectDate(day, btn) {
            document.querySelectorAll('.date-btn').forEach(b => {
                b.className = "date-btn py-2 rounded-xl flex flex-col items-center hover:bg-white/10 text-white/80";
            });
            btn.className = "date-btn py-2 rounded-xl flex flex-col items-center bg-white text-blue-900 font-bold shadow-md scale-105";
            document.getElementById('selectedDateDisplay').innerText = `${day} Tem 2026`;
        }

        // 5. TEMA VE ÇİFT RENK PALETİ MİMARİSİ
        function toggleThemeAccordion() {
            const content = document.getElementById('themeAccordionContent');
            const icon = document.getElementById('accordionIcon');
            if (content.classList.contains('hidden-element')) {
                content.classList.remove('hidden-element');
                icon.innerText = '▲';
            } else {
                content.classList.add('hidden-element');
                icon.innerText = '▼';
            }
        }

        function changeDateCardBg(color) {
            document.getElementById('dateCard').style.backgroundColor = color;
        }

        function changeAppBg(color) {
            document.getElementById('appBody').style.backgroundColor = color;
            document.getElementById('appBody').className = "min-h-screen pb-24 select-none"; // dokuları temizle
        }

        function applyPresetTheme(bgColor, dateColor, textureClass) {
            document.getElementById('appBody').style.backgroundColor = bgColor;
            document.getElementById('appBody').className = `min-h-screen pb-24 select-none ${textureClass}`;
            document.getElementById('dateCard').style.backgroundColor = dateColor;
            
            document.getElementById('bgColorPicker').value = bgColor;
            document.getElementById('dateColorPicker').value = dateColor;
        }
    </script>
</body>
</html>
